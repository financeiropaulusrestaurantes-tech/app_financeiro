function renderValesLancamentos(container){
  const origens = Array.from(new Set(STATE.valeLancamentos.map(l=>l.origem))).sort();
  const unidades = Array.from(new Set(STATE.valeLancamentos.map(l=>l.unidade))).sort();
  const filters = { busca:"", de:"", ate:"", unidade:"", categoria:"", status:"" };
  const sortState = { key:"data", dir:"desc" };
  const sortExtractors = {
    data: l => l.data,
    status: l => l.status,
    categoria: l => l.categoria,
    descricao: l => l.descricao,
    origem: l => l.origem,
    unidade: l => l.unidade,
    valor: l => l.valor,
  };
  const selecionados = new Set();

  container.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;">
      <div>
        <h2 class="serif" style="margin:0;font-size:24px;color:${BRAND[800]};">Vales — Recebimentos</h2>
        <p class="muted" style="margin:4px 0 0;font-size:13px;" id="vale-summary"></p>
      </div>
      <button class="btn btn-primary" id="btn-novo-vale">${icon("plus",16)} Novo vale</button>
    </div>
    <div class="filter-bar">
      <div><span class="field-label">Buscar</span>
        <div style="position:relative;">
          <span style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#a8a29e;">${icon("search",14)}</span>
          <input class="input" style="padding-left:30px;" id="vfl-busca" placeholder="Descrição, origem ou observação" />
        </div>
      </div>
      <div><span class="field-label">De</span><input class="input" type="date" id="vfl-de" /></div>
      <div><span class="field-label">Até</span><input class="input" type="date" id="vfl-ate" /></div>
      <div><span class="field-label">Unidade</span>
        <select class="input" id="vfl-unidade"><option value="">Todas</option>${unidades.map(u=>`<option value="${esc(u)}">${esc(u)}</option>`).join("")}</select></div>
      <div><span class="field-label">Categoria</span>
        <select class="input" id="vfl-categoria"><option value="">Todas</option>${catsFor("vale").map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></div>
      <div><span class="field-label">Status</span>
        <select class="input" id="vfl-status"><option value="">Todos</option><option value="realizado">Recebido</option><option value="previsto">A receber</option></select></div>
    </div>
    <div id="vale-results"></div>`;

  function refresh(){
    const dados = STATE.valeLancamentos.filter(l=>{
      if(filters.busca){ const alvo = `${l.descricao} ${l.origem} ${l.observacao}`.toLowerCase(); if(!alvo.includes(filters.busca.toLowerCase())) return false; }
      if(filters.de && l.data < filters.de) return false;
      if(filters.ate && l.data > filters.ate) return false;
      if(filters.unidade && l.unidade!==filters.unidade) return false;
      if(filters.categoria && l.categoria!==filters.categoria) return false;
      if(filters.status && l.status!==filters.status) return false;
      return true;
    });
    const dadosOrdenados = ordenarPor(dados, sortState, sortExtractors);
    const elegiveis = dadosOrdenados.filter(l=>l.status==="previsto").map(l=>l.id);
    Array.from(selecionados).forEach(id=>{ if(!elegiveis.includes(id)) selecionados.delete(id); });

    const total = dados.reduce((s,l)=> s + (l.status==="realizado"?l.valor:0), 0);
    document.getElementById("vale-summary").innerHTML = `${dados.length} vale(s) · Total recebido: <b style="color:${BRAND[600]};">${currency(total)}</b>${saldoContasInlineHTML()}`;

    const rows = document.getElementById("vale-results");
    rows.innerHTML = `
      ${bulkBarHTML(selecionados, "Marcar como recebido")}
      <div class="card" style="overflow-x:auto;">
        <table>
          <thead><tr>
            ${thCheckAll()}${thSort("Data","data",sortState)}${thSort("Status","status",sortState)}${thSort("Categoria","categoria",sortState)}${thSort("Descrição","descricao",sortState)}${thSort("Origem","origem",sortState)}${thSort("Unidade","unidade",sortState)}
            ${thSort("Valor","valor",sortState,"text-align:right;")}<th style="text-align:right;">Ações</th>
          </tr></thead>
          <tbody>
            ${dadosOrdenados.map(l=>`
              <tr class="vale-row" data-id="${l.id}" style="cursor:pointer;">
                ${l.status==="previsto" ? tdCheck(l.id, selecionados) : "<td></td>"}
                <td style="white-space:nowrap;">${fmtDate(l.data)}</td>
                <td>${valeBadge(l.status)}</td>
                <td style="color:#57534e;">${esc(l.categoria)}</td>
                <td style="font-weight:500;color:#44403c;">${esc(l.descricao)}</td>
                <td style="color:#78716c;">${esc(l.origem)}</td>
                <td style="color:#78716c;">${esc(l.unidade)}</td>
                <td style="text-align:right;font-weight:600;color:${BRAND[600]};">${currency(l.valor)}</td>
                <td>
                  <div style="display:flex;justify-content:flex-end;gap:2px;">
                    <button class="icon-btn edit-vale-btn" data-id="${l.id}">${icon("edit",15,"#78716c")}</button>
                    <button class="icon-btn danger del-vale-btn" data-id="${l.id}">${icon("trash",15,DANGER)}</button>
                  </div>
                </td>
              </tr>`).join("") || `<tr><td colspan="9" class="empty">Nenhum vale encontrado para os filtros aplicados.</td></tr>`}
          </tbody>
        </table>
      </div>`;

    wireSort(rows, sortState, refresh);
    wireTopScroll(rows);
    wireBulkSelect(rows, selecionados, elegiveis, refresh);
    wireBulkQuitar(rows, selecionados, { quitarFn: quitarVale, refresh, confirmMsg: n=>`Marcar ${n} vale(s) como recebido(s) com a data de hoje?` });
    rows.querySelectorAll(".edit-vale-btn").forEach(b=> b.addEventListener("click", ()=>{
      const item = STATE.valeLancamentos.find(l=>l.id===b.dataset.id);
      openValeModal(item, refresh);
    }));
    rows.querySelectorAll(".del-vale-btn").forEach(b=> b.addEventListener("click", ()=>{
      const item = STATE.valeLancamentos.find(l=>l.id===b.dataset.id);
      openConfirm(`Excluir o vale "${item.descricao}" de ${currency(item.valor)}? Essa ação não pode ser desfeita.`, async ()=>{
        try{ await deleteVale(item.id); refresh(); }catch(err){ toast(err.message, true); }
      });
    }));
    rows.querySelectorAll(".vale-row").forEach(tr=> tr.addEventListener("click", (e)=>{
      if(e.target.closest(".icon-btn") || e.target.closest("input")) return;
      const item = STATE.valeLancamentos.find(l=>l.id===tr.dataset.id);
      if(item) openValeDetalheModal(item, refresh);
    }));
  }

  container.querySelector("#btn-novo-vale").addEventListener("click", ()=> openValeModal(null, refresh));
  ["busca","de","ate","unidade","categoria","status"].forEach(k=>{
    const el = container.querySelector(`#vfl-${k}`);
    el.addEventListener(k==="busca"?"input":"change", ()=>{ filters[k]=el.value; refresh(); });
  });
  refresh();
}
function renderValesDashboard(container){
  const periodoState = defaultPeriodoState();

  function build(){
    const noPeriodo = noPeriodoFn(periodoState, l=>l.data);
    const doPeriodo = STATE.valeLancamentos.filter(noPeriodo);
    const recebidos = doPeriodo.filter(l=>l.status==="realizado");
    const totalRecebido = recebidos.reduce((s,l)=>s+l.valor,0);
    const totalPeriodo = doPeriodo.reduce((s,l)=>s+l.valor,0);
    const aReceber = totalPeriodo - totalRecebido;

    const porCategoria = {}; recebidos.forEach(l=>{ porCategoria[l.categoria]=(porCategoria[l.categoria]||0)+l.valor; });
    const topCategorias = Object.entries(porCategoria).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const porOrigem = {}; recebidos.forEach(l=>{ porOrigem[l.origem]=(porOrigem[l.origem]||0)+l.valor; });
    const topOrigens = Object.entries(porOrigem).sort((a,b)=>b[1]-a[1]).slice(0,5);

    const maiorCategoria = topCategorias[0] ? `${topCategorias[0][0]} · ${currency(topCategorias[0][1])}` : "—";
    const origemPrincipal = topOrigens[0] ? `${topOrigens[0][0]} · ${currency(topOrigens[0][1])}` : "—";

    const emAberto = STATE.valeLancamentos.filter(l=>l.status==="previsto").sort((a,b)=>a.data.localeCompare(b.data));
    const hoje = todayISO();

    container.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;">
        <div>
          <h2 class="serif" style="margin:0;font-size:24px;color:${BRAND[800]};">Dashboard — Vales</h2>
          <p class="muted" style="margin:4px 0 0;font-size:13px;">Carteira separada para recebimentos em vales (refeição, alimentação, transporte...).</p>
        </div>
        ${periodoPickerHTML("vdb", periodoState)}
      </div>

      <div class="grid-4" style="margin-bottom:16px;">
        ${statCard("Recebido no período", currency(totalRecebido), "down", BRAND[100], BRAND[600])}
        ${statCard("A receber no período", currency(aReceber), "clipboard", WARN_BG, WARN)}
        ${statCard("Maior categoria", maiorCategoria, "sparkles", BRAND[100], BRAND[600])}
        ${statCard("Origem principal", origemPrincipal, "folder", BRAND[100], BRAND[600])}
      </div>

      <div class="grid-2" style="margin-bottom:16px;">
        <div class="card" style="padding:16px;">
          <h3 class="serif" style="margin:0 0 10px;font-size:15px;color:${BRAND[800]};">Categorias que mais receberam</h3>
          ${topCategorias.length ? `<canvas id="chart-vale-cat" height="200"></canvas>` : `<p class="empty">Sem vales recebidos no período.</p>`}
        </div>
        <div class="card" style="padding:16px;">
          <h3 class="serif" style="margin:0 0 10px;font-size:15px;color:${BRAND[800]};">Recebido por origem</h3>
          ${topOrigens.length ? `<canvas id="chart-vale-origem" height="200"></canvas>` : `<p class="empty">Sem vales recebidos no período.</p>`}
        </div>
      </div>

      <div class="card" style="padding:16px;">
        <h3 class="serif" style="margin:0 0 6px;font-size:15px;color:${BRAND[800]};">Recebimentos em aberto</h3>
        <div style="max-height:360px;overflow-y:auto;">
          ${emAberto.map(l=>{
            const atrasado = l.data < hoje;
            return `<div class="list-row">
              <div style="min-width:0;">
                <p style="margin:0;font-size:14px;font-weight:500;color:#44403c;">${esc(l.descricao)}</p>
                <p style="margin:2px 0 0;font-size:12px;color:#a8a29e;">${esc(l.origem)} · ${esc(l.unidade)}</p>
                <p style="margin:2px 0 0;font-size:12px;${atrasado?`color:${DANGER};font-weight:600;`:"color:#a8a29e;"}">${atrasado?"Previsto em ":"Previsto para "}${fmtDate(l.data)}</p>
              </div>
              <div style="text-align:right;flex-shrink:0;">
                <p style="margin:0;font-size:14px;font-weight:600;color:${BRAND[600]};">${currency(l.valor)}</p>
                <button class="quitar-vale-btn" data-id="${l.id}" style="border:none;background:none;font-size:11px;margin-top:2px;color:${BRAND[600]};text-decoration:underline;cursor:pointer;">Marcar como recebido</button>
              </div>
            </div>`;
          }).join("") || `<p class="empty">Nenhum vale em aberto. Tudo em dia!</p>`}
        </div>
      </div>`;

    wirePeriodoPicker("vdb", container, periodoState, build);
    container.querySelectorAll(".quitar-vale-btn").forEach(b=> b.addEventListener("click", async ()=>{
      try{ await quitarVale(b.dataset.id); build(); }catch(err){ toast(err.message, true); }
    }));

    if(topCategorias.length) mkHBarChart("chart-vale-cat", topCategorias);
    if(topOrigens.length) mkHBarChart("chart-vale-origem", topOrigens);
  }
  build();
}

/* ============================== Faturamentos (clone da Carteira + Duplicatas) ============================== */
function fatLancamentoFormHTML(tipo, item){
  const cats = catsForFat(tipo);
  const label = tipo==="entrada" ? "De quem (origem)" : "Para quem (fornecedor / destino)";
  const status = item?.status || "realizado";
  const isDuplicata = !!(item && item.duplicata);
  return `
    <form id="fat-lanc-form">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px;">
        <label class="field"><span class="field-label">Valor (R$)</span>
          <input class="input" type="number" min="0" step="0.01" id="ff-valor" value="${item?item.valor:""}" placeholder="0,00" required /></label>
        <label class="field">
          <span class="field-label">Categoria</span>
          <select class="input" id="ff-categoria">${cats.map(c=>`<option value="${esc(c)}" ${item&&item.categoria===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
          ${manageCategoriasBtn("fat_"+tipo)}
        </label>
      </div>
      <label class="field"><span class="field-label">${label}</span>
        <input class="input" id="ff-contraparte" value="${esc(item?item.contraparte:"")}" placeholder="Nome do cliente, contrato ou fornecedor" required /></label>
      <label class="field"><span class="field-label">Unidade / Local</span>
        <input class="input" id="ff-unidade" list="fat-unidades-list" value="${esc(item?item.unidade:"")}" placeholder="ex: Unidade Centro" required />
        <datalist id="fat-unidades-list">${Array.from(new Set(STATE.faturamentoLancamentos.map(l=>l.unidade))).map(u=>`<option value="${esc(u)}">`).join("")}</datalist>
      </label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px;">
        <label class="field"><span class="field-label">Status</span>
          <select class="input" id="ff-status">
            <option value="realizado" ${status==="realizado"?"selected":""}>Realizado</option>
            <option value="previsto" ${status==="previsto"?"selected":""}>Previsto (pendente)</option>
          </select></label>
        <label class="field"><span class="field-label" id="ff-date-label">${status==="realizado"?"Data de realização":"Data prevista"}</span>
          <input class="input" type="date" id="ff-data" value="${status==="realizado" ? (item?.data_realizada||todayISO()) : (item?.data_prevista||todayISO())}" required /></label>
      </div>
      ${tipo==="entrada" ? `
      <label class="field"><span class="field-label">Vencimento do faturamento</span>
        <input class="input" type="date" id="ff-vencimento" value="${esc(item?.data_vencimento||"")}" />
        <span class="field-hint">Data-limite de pagamento acordada com o cliente — usada para saber se está dentro do prazo.</span>
      </label>` : ""}
      ${tipo==="saida" ? `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:end;">
        <label class="field" style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
          <input type="checkbox" id="ff-duplicata" ${isDuplicata?"checked":""} style="width:16px;height:16px;" />
          <span style="font-size:13px;color:#44403c;">É uma duplicata?</span>
        </label>
        <label class="field" id="ff-numero-wrap" style="display:${isDuplicata?"block":"none"};">
          <span class="field-label">Número da duplicata</span>
          <input class="input" id="ff-numero-duplicata" value="${esc(item?.numero_duplicata||"")}" placeholder="ex: DP-00123" /></label>
      </div>` : ""}
      <label class="field"><span class="field-label">Observação (opcional)</span>
        <textarea class="input" id="ff-obs" rows="2" placeholder="Detalhes do lançamento...">${esc(item?item.observacao:"")}</textarea></label>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px;">
        <button type="button" class="btn btn-outline" id="ff-cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="ff-submit">${icon("check",15)} Salvar lançamento</button>
      </div>
    </form>`;
}
function openFatLancamentoModal(tipo, item, onSaved){
  const isEdit = !!item;
  openModal({
    title: isEdit ? "Editar lançamento" : `Nova ${tipo==="entrada"?"entrada":"saída"} de faturamento`,
    wide: true,
    bodyHTML: fatLancamentoFormHTML(tipo, item),
    mount: (body)=>{
      const statusSel = body.querySelector("#ff-status");
      statusSel.addEventListener("change", ()=>{
        const lbl = body.querySelector("#ff-date-label");
        lbl.textContent = statusSel.value==="realizado" ? "Data de realização" : "Data prevista";
      });
      body.querySelector("#ff-cancel").addEventListener("click", closeModal);
      const dupCheck = body.querySelector("#ff-duplicata");
      if(dupCheck) dupCheck.addEventListener("change", ()=>{
        body.querySelector("#ff-numero-wrap").style.display = dupCheck.checked ? "block" : "none";
      });
      const gerenciarBtn = body.querySelector("#btn-gerenciar-cat");
      if(gerenciarBtn) gerenciarBtn.addEventListener("click", (e)=>{
        e.preventDefault();
        openCategoriasModal("fat_"+tipo, ()=>{
          const sel = body.querySelector("#ff-categoria");
          const atual = sel.value;
          sel.innerHTML = catsForFat(tipo).map(c=>`<option value="${esc(c)}" ${c===atual?"selected":""}>${esc(c)}</option>`).join("");
        });
      });
      body.querySelector("#fat-lanc-form").addEventListener("submit", async (e)=>{
        e.preventDefault();
        const valor = parseFloat(body.querySelector("#ff-valor").value);
        const contraparte = body.querySelector("#ff-contraparte").value.trim();
        const unidade = body.querySelector("#ff-unidade").value.trim();
        if(!valor || valor<=0 || !contraparte || !unidade) return;
        const status = body.querySelector("#ff-status").value;
        const data = body.querySelector("#ff-data").value || todayISO();
        const duplicata = tipo==="saida" && !!(body.querySelector("#ff-duplicata") && body.querySelector("#ff-duplicata").checked);
        const numeroDuplicata = duplicata ? body.querySelector("#ff-numero-duplicata").value.trim() : null;
        const vencimentoEl = body.querySelector("#ff-vencimento");
        const dataVencimento = tipo==="entrada" ? (vencimentoEl && vencimentoEl.value ? vencimentoEl.value : null) : null;
        const payload = {
          tipo, valor, categoria: body.querySelector("#ff-categoria").value, contraparte, unidade,
          status, data_prevista: status==="realizado" ? (item?.data_prevista||data) : data,
          data_realizada: status==="realizado" ? data : null,
          data_vencimento: dataVencimento,
          duplicata, numero_duplicata: numeroDuplicata,
          observacao: body.querySelector("#ff-obs").value.trim(),
        };
        const btn = body.querySelector("#ff-submit");
        btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Salvando...`;
        try{
          if(isEdit) await editFatLancamento(item.id, payload);
          else await addFatLancamento(payload);
          closeModal();
          onSaved && onSaved();
        }catch(err){ toast(err.message, true); btn.disabled=false; btn.innerHTML = `${icon("check",15)} Salvar lançamento`; }
      });
    }
  });
}

  function refresh(){
    const dados = STATE.faturamentoLancamentos.filter(l=>l.tipo===tipo).filter(l=>{

      if(filters.busca){ const alvo = `${l.contraparte} ${l.observacao} ${l.numero_duplicata||""}`.toLowerCase(); if(!alvo.includes(filters.busca.toLowerCase())) return false; }
      if(filters.de && dataRef < filters.de) return false;
      if(filters.ate && dataRef > filters.ate) return false;
      if(filters.unidade && l.unidade!==filters.unidade) return false;

function renderFatContas(container){
  const hoje = todayISO();
  const filters = { busca:"", de:"", ate:"", unidade:"", categoria:"", status:"previsto" };

  function build(){
    const todas = STATE.faturamentoLancamentos;
    const unidades = Array.from(new Set(todas.map(l=>l.unidade))).sort();
    const categorias = Array.from(new Set(todas.map(l=>l.categoria))).sort();

    container.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;">
        <div>
          <h2 class="serif" style="margin:0;font-size:24px;color:${BRAND[800]};">Faturamentos — Contas a Pagar e a Receber</h2>
          <p class="muted" style="margin:4px 0 0;font-size:13px;" id="contas-summary"></p>
        </div>
      </div>
      <div class="filter-bar">
        <div><span class="field-label">Buscar</span>
          <div style="position:relative;">
            <span style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#a8a29e;">${icon("search",14)}</span>
            <input class="input" style="padding-left:30px;" id="ctf-busca" placeholder="Contraparte ou categoria" />
          </div>
        </div>
        <div><span class="field-label">Vencimento de</span><input class="input" type="date" id="ctf-de" /></div>
        <div><span class="field-label">Vencimento até</span><input class="input" type="date" id="ctf-ate" /></div>
        <div><span class="field-label">Unidade</span>
          <select class="input" id="ctf-unidade"><option value="">Todas</option>${unidades.map(u=>`<option value="${esc(u)}">${esc(u)}</option>`).join("")}</select></div>
        <div><span class="field-label">Categoria</span>
          <select class="input" id="ctf-categoria"><option value="">Todas</option>${categorias.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></div>
        <div><span class="field-label">Status</span>
          <select class="input" id="ctf-status"><option value="previsto">Em aberto</option><option value="realizado">Já quitado</option><option value="">Todos</option></select></div>
      </div>
      <div id="contas-results"></div>
      <style>@media(min-width:900px){.contas-flex{flex-direction:row !important;}}</style>`;

    ["busca","de","ate","unidade","categoria","status"].forEach(k=>{
      const el = container.querySelector(`#ctf-${k}`);
      el.value = filters[k];
      el.addEventListener(k==="busca"?"input":"change", ()=>{ filters[k]=el.value; refresh(); });
    });

    refresh();
  }

  function passaFiltros(l){
    if(filters.busca){ const alvo = `${l.contraparte} ${l.categoria}`.toLowerCase(); if(!alvo.includes(filters.busca.toLowerCase())) return false; }
    if(filters.de && l.data_prevista < filters.de) return false;
    if(filters.ate && l.data_prevista > filters.ate) return false;
    if(filters.unidade && l.unidade!==filters.unidade) return false;
    if(filters.categoria && l.categoria!==filters.categoria) return false;
    if(filters.status && l.status!==filters.status) return false;
    return true;
  }

  function refresh(){
    const pagar = STATE.faturamentoLancamentos.filter(l=>l.tipo==="saida").filter(passaFiltros).sort((a,b)=>a.data_prevista.localeCompare(b.data_prevista));
    const receber = STATE.faturamentoLancamentos.filter(l=>l.tipo==="entrada").filter(passaFiltros).sort((a,b)=>a.data_prevista.localeCompare(b.data_prevista));

    document.getElementById("contas-summary").innerHTML = `${pagar.length+receber.length} lançamento(s) encontrado(s) · A pagar: <b style="color:${DANGER};">${currency(pagar.reduce((s,i)=>s+i.valor,0))}</b> · A receber: <b style="color:${BRAND[600]};">${currency(receber.reduce((s,i)=>s+i.valor,0))}</b>`;

    const lista = (titulo, itens, cor, acaoLabel) => `
      <div class="card" style="flex:1;overflow:hidden;">
        <div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
          <h3 class="serif" style="margin:0;font-size:17px;color:${BRAND[800]};">${titulo}</h3>
          <span style="font-size:12px;font-weight:600;color:${cor};">${currency(itens.reduce((s,i)=>s+i.valor,0))}</span>
        </div>
        <div style="max-height:540px;overflow-y:auto;">
          ${itens.map(l=>{
            const atrasado = l.status==="previsto" && l.data_prevista < hoje;
            return `<div class="list-row">
              <div style="min-width:0;">
                <p style="margin:0;font-size:14px;font-weight:500;color:#44403c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(l.contraparte)}</p>
                <p style="margin:2px 0 0;font-size:12px;color:#a8a29e;">${esc(l.categoria)} · ${esc(l.unidade)}</p>
                <p style="margin:2px 0 0;font-size:12px;${atrasado?`color:${DANGER};font-weight:600;`:"color:#a8a29e;"}">${l.status==="realizado"?"Quitado em ":atrasado?"Vencido em ":"Previsto para "}${fmtDate(l.status==="realizado"&&l.data_realizada?l.data_realizada:l.data_prevista)}</p>
              </div>
              <div style="text-align:right;flex-shrink:0;">
                <p style="margin:0;font-size:14px;font-weight:600;color:${cor};">${currency(l.valor)}</p>
                ${l.status==="previsto" ? `<button class="quitar-fat-btn" data-id="${l.id}" style="border:none;background:none;font-size:11px;margin-top:2px;color:${BRAND[600]};text-decoration:underline;cursor:pointer;">${acaoLabel}</button>` : ""}
              </div>
            </div>`;
          }).join("") || `<p class="empty">Nada por aqui para os filtros aplicados.</p>`}
        </div>
      </div>`;

    const rows = document.getElementById("contas-results");
    rows.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:14px;" class="contas-flex">
        ${lista("Contas a Pagar", pagar, DANGER, "Marcar como pago")}
        ${lista("Contas a Receber", receber, BRAND[600], "Marcar como recebido")}
      </div>`;

    rows.querySelectorAll(".quitar-fat-btn").forEach(b=> b.addEventListener("click", async ()=>{
      try{ await quitarFatConta(b.dataset.id); refresh(); }catch(err){ toast(err.message, true); }
    }));
  }

  build();
}
/* ---- Exportação de duplicatas em XML (Títulos a Pagar) ---- */
function xmlEscape(s){ return String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c])); }
function fornecedorDocumentoPorNome(nome){
  const alvo = String(nome||"").trim().toLowerCase();
  const f = STATE.fornecedores.find(f=>f.nome.trim().toLowerCase()===alvo);
  return f ? (f.documento||"") : "";
}
function gerarTitulosPagarXML(lista){
  const linhas = lista.map(l=>{
    const pago = l.status==="realizado";
    return `  <titulo>
    <vencimento>${xmlEscape(l.data_prevista)}</vencimento>
    <cnpjCpf>${xmlEscape(fornecedorDocumentoPorNome(l.contraparte))}</cnpjCpf>
    <fornecedor>${xmlEscape(l.contraparte)}</fornecedor>

    <tipoDeBaixa>${xmlEscape(pago ? "Baixa manual" : "")}</tipoDeBaixa>
    <valorOriginal>${Number(l.valor||0).toFixed(2)}</valorOriginal>
    <valorLiquido>${Number(l.valor||0).toFixed(2)}</valorLiquido>
    <valorPago>${Number(pago ? l.valor : 0).toFixed(2)}</valorPago>
    <numeroDuplicata>${xmlEscape(l.numero_duplicata||"")}</numeroDuplicata>
  </titulo>`;
  }).join("\n");
  return `<?xml version="1.0" encoding="UTF-8"?>\n<titulosAPagar geradoEm="${new Date().toISOString()}">\n${linhas}\n</titulosAPagar>\n`;
}
function baixarArquivoTexto(conteudo, nomeArquivo, mime){
  const blob = new Blob([conteudo], {type: mime||"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nomeArquivo;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ---- Importação de títulos (planilha .xlsx de Contas a Pagar / a Receber) ---- */
function lerPlanilha(file){
  return new Promise((resolve, reject)=>{
    if(typeof XLSX==="undefined"){ reject(new Error("Biblioteca de leitura de planilhas não carregou. Verifique sua conexão e recarregue a página.")); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Falha ao ler o arquivo."));
    reader.onload = (e) => {
      try{
        const wb = XLSX.read(e.target.result, { type:"array", cellDates:true });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:null });
        resolve(rows);
      }catch(err){ reject(new Error("Arquivo inválido ou corrompido.")); }
    };
    reader.readAsArrayBuffer(file);
  });
}
function acharColunaPrioridade(headerRow, candidatos){
  const normalizados = headerRow.map(h=>String(h||"").trim().toLowerCase());
  for(const cand of candidatos){
    const idx = normalizados.indexOf(cand.toLowerCase());
    if(idx>=0) return idx;
  }
  return -1;
}
function parseDataBR(v){
  if(v==null || v==="") return null;
  if(v instanceof Date) return v.toISOString().slice(0,10);
  const s = String(v).trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){
    let [, d, mo, y] = m;
    if(y.length===2) y = "20"+y;
    return `${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}`;
  }
  const isoMatch = s.match(/^\d{4}-\d{2}-\d{2}/);
  return isoMatch ? isoMatch[0] : null;
}
function parseValorNum(v){
  if(v==null || v==="") return 0;
  if(typeof v==="number") return v;
  const s = String(v).trim().replace(/\./g,"").replace(",",".").replace(/[^\d.-]/g,"");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function extrairTitulosDaPlanilha(rows, tipo){
  if(!rows || rows.length<2) return { ok:[], erros:[{linha:0}] };
  const header = rows[0];
  const idxVenc = acharColunaPrioridade(header, ["Vencimento"]);
  const idxDoc = acharColunaPrioridade(header, ["CNPJ/CPF"]);
  const idxNome = acharColunaPrioridade(header, tipo==="entrada" ? ["Cliente","Fornecedor"] : ["Fornecedor","Cliente"]);
  const idxValor = acharColunaPrioridade(header, tipo==="entrada" ? ["Valor Líquido Final","Valor Líquido","Valor Original"] : ["Valor Líquido","Valor Original"]);
  const ok = [], erros = [];
  for(let i=1;i<rows.length;i++){
    const row = rows[i];
    if(!row || row.every(c=>c==null||c==="")) continue;
    const vencimentoISO = idxVenc>=0 ? parseDataBR(row[idxVenc]) : null;
    const nome = idxNome>=0 ? String(row[idxNome]||"").trim() : "";
    if(!vencimentoISO || !nome){ erros.push({linha:i+1}); continue; }
    const documento = idxDoc>=0 ? String(row[idxDoc]||"").trim() : "";
    const valor = idxValor>=0 ? parseValorNum(row[idxValor]) : 0;
    ok.push({ vencimentoISO, nome, documento, valor });
  }
  return { ok, erros };
}

function openImportarTitulosModal(tipo, onImported){
  openModal({
    title: tipo==="entrada" ? "Importar Títulos a Receber" : "Importar Títulos a Pagar",
    wide: true,
    bodyHTML: importarTitulosFormHTML(tipo),
    mount:(body)=>{
      const fileInput = body.querySelector("#imp-arquivo");
      const preview = body.querySelector("#imp-preview");
      const submitBtn = body.querySelector("#imp-submit");
      body.querySelector("#imp-cancel").addEventListener("click", closeModal);
      const gerenciarBtnImp = body.querySelector("#btn-gerenciar-cat");
      if(gerenciarBtnImp) gerenciarBtnImp.addEventListener("click", (e)=>{
        e.preventDefault();
        openCategoriasModal("fat_"+tipo, ()=>{
          const sel = body.querySelector("#imp-categoria");

          sel.innerHTML = catsForFat(tipo).map(c=>`<option value="${esc(c)}" ${c===atual?"selected":""}>${esc(c)}</option>`).join("");
        });
      });
      fileInput.addEventListener("change", async ()=>{

        submitBtn.disabled = true;
        if(!file){ preview.innerHTML=""; return; }
        preview.innerHTML = `<p class="field-hint">Lendo planilha...</p>`;
        try{
          const rows = await lerPlanilha(file);
          const { ok, erros } = extrairTitulosDaPlanilha(rows, tipo);

          wireLinhasImportEditaveis(body, submitBtn);

          vencimentoISO: tr.querySelector(".imp-venc").value,
          nome: tr.querySelector(".imp-nome").value.trim(),

            if(criado) novasContrapartes++;

          const payload = linhasAtuais.map(l=>({
            tipo, categoria, contraparte: l.nome, unidade,
            status: "previsto",
            data_prevista: l.vencimentoISO,
            data_realizada: null,
            valor: l.valor,
            observacao: `Importado de planilha em ${fmtDate(todayISO())}.`,
            ...(tipo==="saida" ? { duplicata:true, numero_duplicata:null } : { data_vencimento: l.vencimentoISO }),
          }));
          await addFatLancamentosEmLote(payload);
          closeModal();

          onImported && onImported();
        }catch(err){ toast(err.message, true); submitBtn.disabled=false; submitBtn.innerHTML = `${icon("check",15)} Importar`; }
      });

  });
}

  function build(){

                <td style="color:#78716c;">${esc(l.unidade)}</td>
                <td style="text-align:right;font-weight:600;color:${DANGER};">${currency(l.valor)}</td>
                <td style="text-align:right;">${l.status==="previsto" ? `<button class="quitar-dup-btn" data-id="${l.id}" style="border:none;background:none;font-size:11px;color:${BRAND[600]};text-decoration:underline;cursor:pointer;">Marcar como pago</button>` : ""}</td>
              </tr>`;
            }).join("") || `<tr><td colspan="9" class="empty">Nenhuma duplicata encontrada para os filtros aplicados.</td></tr>`}
          </tbody>
        </table>
      </div>`;

    wireSort(rows, sortState, refresh);
    wireTopScroll(rows);
    wireBulkSelect(rows, selecionados, elegiveis, refresh);
    wireBulkQuitar(rows, selecionados, { quitarFn: quitarFatConta, refresh, confirmMsg: n=>`Marcar ${n} duplicata(s) como paga(s) com a data de hoje?` });
    rows.querySelector("#btn-exportar-dup-xml").addEventListener("click", ()=>{
      const alvo = selecionados.size>0 ? duplicatasOrdenadas.filter(l=>selecionados.has(l.id)) : duplicatasOrdenadas;
      if(alvo.length===0){ toast("Nenhuma duplicata para exportar.", true); return; }
      baixarArquivoTexto(gerarTitulosPagarXML(alvo), `titulos-a-pagar-${todayISO()}.xml`, "application/xml");
      toast(`${alvo.length} título(s) exportado(s) em XML.`);
    });
    rows.querySelector("#btn-importar-dup").addEventListener("click", ()=>{
      openImportarTitulosModal("saida", refresh);
    });
    rows.querySelectorAll(".quitar-dup-btn").forEach(b=> b.addEventListener("click", async ()=>{
      try{ await quitarFatConta(b.dataset.id); refresh(); }catch(err){ toast(err.message, true); }
    }));
    rows.querySelectorAll(".fat-row").forEach(tr=> tr.addEventListener("click", (e)=>{
      if(e.target.closest(".icon-btn") || e.target.closest(".quitar-dup-btn") || e.target.closest("input")) return;
      const item = STATE.faturamentoLancamentos.find(l=>l.id===tr.dataset.id);
      if(item) openFatLancamentoDetalheModal(item, refresh);
    }));
  }

  build();
}

          ${pagarPend.map(l=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #faf9f6;font-size:14px;"><span style="color:#57534e;">${esc(l.contraparte)}</span><span style="font-weight:500;color:${DANGER};">${currency(l.valor)}</span></div>`).join("") || `<p class="muted" style="font-size:13px;padding:10px 0;">Nenhuma pendência.</p>`}

function renderFatPersonalizado(container){
  let modo = "categoria";
  let valorSel = "";

  function build(){
    const set = new Set(); STATE.faturamentoLancamentos.forEach(l=> set.add(modo==="categoria"?l.categoria:l.contraparte));
    const opcoes = Array.from(set).sort();
    const filtrados = valorSel ? STATE.faturamentoLancamentos.filter(l=> (modo==="categoria"?l.categoria:l.contraparte)===valorSel) : [];
    const entradas = filtrados.filter(l=>l.tipo==="entrada"&&l.status==="realizado").reduce((s,l)=>s+l.valor,0);
    const saidas = filtrados.filter(l=>l.tipo==="saida"&&l.status==="realizado").reduce((s,l)=>s+l.valor,0);

    const porMes = {};
    filtrados.forEach(l=>{ if(l.status!=="realizado") return; const mk=monthKey(l.data_realizada); porMes[mk]=porMes[mk]||0; porMes[mk]+= l.tipo==="entrada"?l.valor:-l.valor; });
    const serieKeys = Object.keys(porMes).sort();

    container.innerHTML = `
      <h2 class="serif" style="margin:0 0 4px;font-size:24px;color:${BRAND[800]};">Faturamentos — Análise Personalizada</h2>
      <p class="muted" style="margin:0 0 18px;font-size:13px;">Filtre por categoria ou por cliente/fornecedor específico para ver um recorte dedicado.</p>
      <div class="card" style="padding:14px;margin-bottom:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;">
        <div><span class="field-label">Analisar por</span>
          <select class="input" id="fpz-modo" style="width:auto;"><option value="categoria" ${modo==="categoria"?"selected":""}>Categoria</option><option value="contraparte" ${modo==="contraparte"?"selected":""}>Cliente / Fornecedor</option></select></div>

          <select class="input" id="fpz-valor"><option value="">Selecione...</option>${opcoes.map(o=>`<option value="${esc(o)}" ${o===valorSel?"selected":""}>${esc(o)}</option>`).join("")}</select></div>
      </div>
      <div id="fpz-results">
        ${!valorSel ? `<div class="card empty" style="border-style:dashed;padding:60px 10px;">Selecione uma categoria ou um cliente/fornecedor acima para gerar a análise.</div>` : `
        <div class="grid-4" style="margin-bottom:16px;">
          ${statCard("Total recebido", currency(entradas), "down", BRAND[100], BRAND[600])}
          ${statCard("Total gasto", currency(saidas), "up", DANGER_BG, DANGER)}
          ${statCard("Saldo líquido", currency(entradas-saidas), "trending", BRAND[100], BRAND[600])}
          ${statCard("Lançamentos", filtrados.length, "clipboard", WARN_BG, WARN)}
        </div>
        <div class="card" style="padding:16px;margin-bottom:16px;">
          <h3 class="serif" style="margin:0 0 10px;font-size:15px;color:${BRAND[800]};">Evolução mensal (líquido)</h3>
          ${serieKeys.length ? `<canvas id="chart-fat-pz" height="180"></canvas>` : `<p class="empty">Sem lançamentos realizados para esse recorte.</p>`}
        </div>
        <div class="card" style="overflow-x:auto;">
          <table><thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Contraparte</th><th>Unidade</th><th style="text-align:right;">Valor</th></tr></thead>
          <tbody>${filtrados.sort((a,b)=>(b.data_realizada||b.data_prevista).localeCompare(a.data_realizada||a.data_prevista)).map(l=>`
            <tr><td>${fmtDate(l.data_realizada||l.data_prevista)}</td><td>${l.tipo==="entrada"?"Entrada":"Saída"}</td>
            <td style="color:#78716c;">${esc(l.categoria)}</td><td style="font-weight:500;">${esc(l.contraparte)}</td><td style="color:#78716c;">${esc(l.unidade)}</td>
            <td style="text-align:right;font-weight:600;color:${l.tipo==="entrada"?BRAND[600]:DANGER};">${currency(l.valor)}</td></tr>`).join("")}</tbody></table>
        </div>`}
      </div>`;

    container.querySelector("#fpz-modo").addEventListener("change",(e)=>{ modo=e.target.value; valorSel=""; build(); });
    const valSel = container.querySelector("#fpz-valor");
    if(valSel) valSel.addEventListener("change",(e)=>{ valorSel=e.target.value; build(); });
    wireTopScroll(container);

    if(valorSel && serieKeys.length){
      const ctx = document.getElementById("chart-fat-pz");
      if(CHARTS["chart-fat-pz"]) CHARTS["chart-fat-pz"].destroy();
      CHARTS["chart-fat-pz"] = new Chart(ctx, {
        type:"line",
        data:{ labels: serieKeys.map(monthLabel), datasets:[{ data: serieKeys.map(k=>porMes[k]), borderColor:BRAND[600], backgroundColor:BRAND[100], fill:true, tension:.35, pointRadius:3 }] },
        options:{ plugins:{legend:{display:false}, tooltip:{callbacks:{label:(c)=>currency(c.raw)}}}, scales:{ y:{ticks:{callback:(v)=>(v/1000)+"k"}, grid:{color:"#f1efe9"}}, x:{grid:{display:false}} } }
      });
    }
  }
  build();
}

function cartaoUltimos4Digits(v){ return String(v||"").replace(/\D/g,"").slice(-4); }

function cartaoSelectOptionsHTML(selecionado){
  const nomes = STATE.cartoes.map(c=>c.nome);
  const extra = (selecionado && !nomes.includes(selecionado)) ? `<option value="${esc(selecionado)}" selected>${esc(selecionado)} (não cadastrado)</option>` : "";
  return `<option value="">Selecione um cartão...</option>${extra}${STATE.cartoes.map(c=>`<option value="${esc(c.nome)}" ${c.nome===selecionado?"selected":""}>${esc(c.nome)} — •••• ${esc(c.ultimos_digitos)}</option>`).join("")}`;
}
function openCartaoCadastroModal(item, onSaved, {nested=false}={}){
  const open = nested ? openNestedModal : openModal;
  const close = nested ? closeNestedModal : closeModal;
  open({
    title: item ? "Editar cartão" : "Novo cartão",
    bodyHTML: cartaoCadastroFormHTML(item),
    mount:(body)=>{
      const digitosInput = body.querySelector("#cc-digitos");
      digitosInput.addEventListener("input", ()=>{ digitosInput.value = cartaoUltimos4Digits(digitosInput.value); });
      body.querySelector("#cc-cancel").addEventListener("click", close);
      body.querySelector("#cartao-cad-form").addEventListener("submit", async (e)=>{
        e.preventDefault();
        const nome = body.querySelector("#cc-nome").value.trim();
        const digitos = cartaoUltimos4Digits(digitosInput.value);
        if(!nome || digitos.length!==4) return;
        const btn = body.querySelector("#cc-submit");
        btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Salvando...`;
        try{
          let salvo;
          if(item) salvo = await editCartao(item.id, nome, digitos);
          else salvo = await addCartao(nome, digitos);
          close(); onSaved && onSaved(salvo);
        }catch(err){
          toast(/duplicate|unique/i.test(err.message) ? "Já existe um cartão com esse nome." : err.message, true);
          btn.disabled=false; btn.innerHTML = `${icon("check",15)} Salvar cartão`;
        }
      });
    }
  });
}
function renderCadCartoes(container){
  const sortState = { key:"nome", dir:"asc" };
  const sortExtractors = { nome: c=>c.nome, digitos: c=>c.ultimos_digitos, criado: c=>c.criado_em, usuario: c=>c.usuario_nome };

  function refresh(){
    const dados = ordenarPor(STATE.cartoes, sortState, sortExtractors);
    container.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;">
        <div>
          <h2 class="serif" style="margin:0;font-size:24px;color:${BRAND[800]};">Cadastro de Cartões</h2>
          <p class="muted" style="margin:4px 0 0;font-size:13px;">${STATE.cartoes.length} cartão(ões) cadastrado(s) · guardamos só nome e últimos 4 dígitos.</p>
        </div>
        <button class="btn btn-primary" id="btn-novo-cartao-cad">${icon("plus",16)} Novo cartão</button>
      </div>
      <div class="card" style="overflow-x:auto;">
        <table>
          <thead><tr>${thSort("Nome","nome",sortState)}${thSort("Últimos 4 dígitos","digitos",sortState)}${thSort("Cadastrado em","criado",sortState)}${thSort("Cadastrado por","usuario",sortState)}<th style="text-align:right;">Ações</th></tr></thead>
          <tbody>
            ${dados.map(c=>`
              <tr>
                <td style="font-weight:500;color:#44403c;">${esc(c.nome)}</td>
                <td style="color:#78716c;letter-spacing:1px;">•••• ${esc(c.ultimos_digitos)}</td>
                <td style="color:#a8a29e;white-space:nowrap;">${fmtDate((c.criado_em||"").slice(0,10))}</td>
                <td style="color:#a8a29e;font-size:12px;">${esc(c.usuario_nome||"—")}</td>
                <td>
                  <div style="display:flex;justify-content:flex-end;gap:2px;">
                    <button class="icon-btn edit-cartaocad-btn" data-id="${c.id}">${icon("edit",15,"#78716c")}</button>
                    <button class="icon-btn danger del-cartaocad-btn" data-id="${c.id}">${icon("trash",15,DANGER)}</button>
                  </div>
                </td>
              </tr>`).join("") || `<tr><td colspan="5" class="empty">Nenhum cartão cadastrado ainda.</td></tr>`}
          </tbody>
        </table>
      </div>`;

    wireSort(container, sortState, refresh);
    wireTopScroll(container);
    container.querySelector("#btn-novo-cartao-cad").addEventListener("click", ()=> openCartaoCadastroModal(null, refresh));
    container.querySelectorAll(".edit-cartaocad-btn").forEach(b=> b.addEventListener("click", ()=>{
      const item = STATE.cartoes.find(c=>c.id===b.dataset.id);
      openCartaoCadastroModal(item, refresh);
    }));
    container.querySelectorAll(".del-cartaocad-btn").forEach(b=> b.addEventListener("click", ()=>{
      const item = STATE.cartoes.find(c=>c.id===b.dataset.id);
      openConfirm(`Excluir o cartão "${item.nome}" (•••• ${item.ultimos_digitos})? Gastos já lançados com esse cartão não são afetados.`, async ()=>{
        try{ await deleteCartao(item.id); refresh(); }catch(err){ toast(err.message, true); }
      });
    }));
  }
  refresh();
}

function renderSeguranca(container){
  container.innerHTML = `
    <div style="margin-bottom:18px;">
      <h2 class="serif" style="margin:0;font-size:24px;color:${BRAND[800]};">Segurança</h2>
      <p class="muted" style="margin:4px 0 0;font-size:13px;">Gerencie a autenticação de 2 fatores da sua própria conta.</p>
    </div>
    <div class="card" style="padding:22px;max-width:440px;">
      <div id="seg-conteudo" style="min-height:120px;display:flex;align-items:center;justify-content:center;">
        <span class="spinner" style="border-color:rgba(0,0,0,.15);border-top-color:${BRAND[600]};"></span>
      </div>
    </div>`;
  async function carregar(){
    const conteudo = document.getElementById("seg-conteudo");
    if(!conteudo) return;
    try{
      const factores = await mfaListFactors(STATE.session.access_token);
      const totp = factores.find(f=>f.factor_type==="totp" && f.status==="verified");
      if(totp){
        conteudo.innerHTML = segurancaAtivadaHTML();
        conteudo.querySelector("#seg-desativar").addEventListener("click", ()=>{
          openConfirm("Desativar a autenticação de 2 fatores da sua conta? Da próxima vez, o login vai pedir só a senha.", async ()=>{
            try{
              await mfaUnenroll(STATE.session.access_token, totp.id);
              toast("2FA desativado.");
              carregar();
            }catch(err){ toast(err.message, true); }
          });
        });
      }else{
        conteudo.innerHTML = segurancaDesativadaHTML();
        conteudo.querySelector("#seg-ativar").addEventListener("click", async ()=>{
          const btn = conteudo.querySelector("#seg-ativar");
          btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Preparando...`;
          try{
            const pendentes = factores.filter(f=>f.factor_type==="totp" && f.status==="unverified");
            for(const p of pendentes){ try{ await mfaUnenroll(STATE.session.access_token, p.id); }catch(e){} }
            const enroll = await mfaEnroll(STATE.session.access_token, `${STATE.currentUser.nome} · ${Date.now()}`);
            conteudo.innerHTML = segurancaEnrollHTML(enroll);
            conteudo.querySelector("#seg-enroll-cancel").addEventListener("click", async ()=>{
              try{ await mfaUnenroll(STATE.session.access_token, enroll.id); }catch(e){}
              carregar();
            });
            conteudo.querySelector("#seg-enroll-form").addEventListener("submit", async (e)=>{
              e.preventDefault();
              const code = conteudo.querySelector("#seg-enroll-code").value.trim();
              const errEl = conteudo.querySelector("#seg-enroll-err");
              const subBtn = conteudo.querySelector("#seg-enroll-submit");
              errEl.style.display = "none";
              if(!/^\d{6}$/.test(code)){ errEl.textContent = "Digite os 6 dígitos do código."; errEl.style.display = "block"; return; }
              subBtn.disabled = true; subBtn.innerHTML = `<span class="spinner"></span> Confirmando...`;
              try{
                const challenge = await mfaChallenge(STATE.session.access_token, enroll.id);
                const verified = await mfaVerify(STATE.session.access_token, enroll.id, challenge.id, code);
                STATE.session = verified;
                await saveRefreshToken(verified.refresh_token);
                toast("2FA ativado com sucesso!");
                carregar();
              }catch(err){
                errEl.textContent = /invalid|expired/i.test(err.message) ? "Código inválido ou expirado. Tente novamente." : err.message;
                errEl.style.display = "block";
                subBtn.disabled = false; subBtn.innerHTML = `${icon("check",15)} Confirmar e ativar`;
              }
            });
          }catch(err){ toast(err.message, true); btn.disabled=false; btn.innerHTML = `${icon("lock",15)} Ativar autenticação de 2 fatores`; }
        });
      }
    }catch(err){
      conteudo.innerHTML = `<p style="color:${DANGER};font-size:13px;text-align:center;">${esc(err.message)}</p>`;
    }
  }
  carregar();
}

/* ============================== Usuários ============================== */
function usuarioFormHTML(item, actingCargo){
  const cargoAtual = item?.cargo || "usuario";
  const opcoesCargo = actingCargo==="super_admin"
    ? [["usuario","Usuário"],["admin","Admin"],["super_admin","Super Admin"]]
    : [["usuario","Usuário"]];
  const permissoesAtuais = item?.permissoes || [];
  return `
    <form id="user-form">
      <label class="field"><span class="field-label">Nome completo</span><input class="input" id="uf-nome" value="${esc(item?item.nome:"")}" required /></label>
      ${item ? "" : `
      <label class="field"><span class="field-label">E-mail</span><input class="input" type="email" id="uf-email" required /></label>
      <label class="field"><span class="field-label">Senha provisória</span><input class="input" type="password" id="uf-senha" required minlength="6" /></label>`}
      <label class="field"><span class="field-label">Perfil de acesso</span>
        <select class="input" id="uf-cargo">
          ${opcoesCargo.map(([v,l])=>`<option value="${v}" ${cargoAtual===v?"selected":""}>${l}</option>`).join("")}
        </select>
        ${actingCargo!=="super_admin" ? `<span class="field-hint">Só um Super Admin pode criar ou editar contas Admin/Super Admin.</span>` : ""}
      </label>
      <div id="uf-permissoes-wrap" style="display:${cargoAtual==="usuario"?"block":"none"};">
        <span class="field-label">Categorias e contas liberadas para este usuário</span>
        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:6px;">
          ${PERMISSOES_GRUPOS.map(g=>{
            const todosItens = permItemsFlat(g);
            const todosMarcados = todosItens.every(it=>permissoesAtuais.includes(it.id));
            return `
            <div class="card" style="padding:10px 12px;">
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:${BRAND[700]};cursor:pointer;margin-bottom:9px;">
                <input type="checkbox" class="uf-group-check" data-group="${g.id}" ${todosMarcados?"checked":""} style="width:15px;height:15px;flex-shrink:0;" />
                ${icon(g.ic,15,BRAND[600])} ${esc(g.label)}
              </label>
              <div style="display:flex;flex-direction:column;gap:11px;padding-left:23px;">
                ${g.subgrupos.map(sg=>`
                  <div>
                    <p style="margin:0 0 5px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#a8a29e;">${esc(sg.label)}</p>
                    <div style="display:flex;flex-direction:column;gap:5px;">
                      ${sg.items.map(it=>`
                        <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:#57534e;cursor:pointer;">
                          <input type="checkbox" class="uf-perm-check" data-group="${g.id}" value="${it.id}" ${permissoesAtuais.includes(it.id)?"checked":""} style="width:14px;height:14px;flex-shrink:0;" />
                          ${esc(it.label)}
                        </label>`).join("")}
                    </div>
                  </div>`).join("")}
              </div>
            </div>`;
          }).join("")}
        </div>
        <span class="field-hint">Marque a categoria inteira ou só as contas/abas específicas dentro dela — cada uma corresponde a uma aba do menu deslizante nas telas de Financeiro. Admins e Super Admins sempre têm acesso a tudo, incluindo esta tela.</span>
      </div>
      ${item ? `<p class="field-hint">Alteração de e-mail ou senha deve ser feita pelo próprio usuário na tela de login do Supabase.</p>` : `<p class="field-hint">Dependendo da configuração do projeto, pode ser necessário confirmar o e-mail antes do primeiro acesso.</p>`}
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px;">
        <button type="button" class="btn btn-outline" id="uf-cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="uf-submit">${icon("check",15)} Salvar</button>
      </div>
    </form>`;
}
function openUsuarioModal(item, onSaved){
  const actingCargo = STATE.currentUser.cargo;
  openModal({
    title: item ? "Editar usuário" : "Novo usuário",
    bodyHTML: usuarioFormHTML(item, actingCargo),
    mount:(body)=>{
      body.querySelector("#uf-cancel").addEventListener("click", closeModal);
      const cargoSel = body.querySelector("#uf-cargo");
      const permWrap = body.querySelector("#uf-permissoes-wrap");
      cargoSel.addEventListener("change", ()=>{ permWrap.style.display = cargoSel.value==="usuario" ? "block" : "none"; });
      body.querySelectorAll(".uf-group-check").forEach(gc=>{
        gc.addEventListener("change", ()=>{
          body.querySelectorAll(`.uf-perm-check[data-group="${gc.dataset.group}"]`).forEach(ic=>{ ic.checked = gc.checked; });
        });
      });
      body.querySelectorAll(".uf-perm-check").forEach(ic=>{
        ic.addEventListener("change", ()=>{
          const grupo = ic.dataset.group;
          const irmaos = body.querySelectorAll(`.uf-perm-check[data-group="${grupo}"]`);
          const gc = body.querySelector(`.uf-group-check[data-group="${grupo}"]`);
          if(gc) gc.checked = Array.from(irmaos).every(s=>s.checked);
        });
      });
      body.querySelector("#user-form").addEventListener("submit", async (e)=>{
        e.preventDefault();
        const nome = body.querySelector("#uf-nome").value.trim();
        const cargo = cargoSel.value;
        const permissoes = cargo==="usuario" ? Array.from(body.querySelectorAll(".uf-perm-check:checked")).map(el=>el.value) : [];
        const btn = body.querySelector("#uf-submit");
        btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Salvando...`;
        try{
          if(item){
            await editarUsuario(item.id, { nome, cargo, permissoes });
            if(item.id===STATE.currentUser.id){ ajustarViewInicial(); renderSidebar(); renderView(); }
          }else{
            const email = body.querySelector("#uf-email").value.trim();
            const senha = body.querySelector("#uf-senha").value;
            if(!email || senha.length < 6) throw new Error("Preencha e-mail e uma senha com pelo menos 6 caracteres.");
            await criarUsuario({ nome, email, senha, cargo, permissoes });
          }
          closeModal(); onSaved && onSaved();
        }catch(err){ toast(err.message, true); btn.disabled=false; btn.innerHTML = `${icon("check",15)} Salvar`; }
      });
    }
  });
}
function renderUsuarios(container){
  function build(){
    container.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
        <div><h2 class="serif" style="margin:0;font-size:24px;color:${BRAND[800]};">Usuários</h2>
        <p class="muted" style="margin:4px 0 0;font-size:13px;">Gerencie quem tem acesso ao sistema financeiro e a quais abas cada um pode chegar.</p></div>
        <button class="btn btn-primary" id="btn-novo-user">${icon("plus",16)} Novo usuário</button>
      </div>
      <div class="card" style="overflow-x:auto;">
        <table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Abas liberadas</th><th style="text-align:right;">Ações</th></tr></thead>
        <tbody>${STATE.users.map(u=>{
          const podeEditar = STATE.currentUser.cargo==="super_admin" || (STATE.currentUser.cargo==="admin" && u.cargo==="usuario");
          return `
          <tr>
            <td style="font-weight:500;color:#44403c;">${esc(u.nome)}${u.id===STATE.currentUser.id?` <span class="muted" style="font-size:10px;">(você)</span>`:""}</td>
            <td style="color:#78716c;">${esc(u.email||"—")}</td>
            <td>${cargoBadge(u.cargo)}</td>
            <td>${permissoesBadges(u)}</td>
            <td><div style="display:flex;justify-content:flex-end;gap:2px;">
              ${podeEditar ? `<button class="icon-btn edit-user-btn" data-id="${u.id}">${icon("edit",15,"#78716c")}</button>` : `<span class="muted" style="font-size:11px;">—</span>`}
            </div></td>
          </tr>`;
        }).join("")}</tbody></table>
      </div>
      <p class="muted" style="font-size:11px;margin-top:10px;">Remover o acesso de um usuário exige a chave de administração do Supabase (Service Role) e, por segurança, não fica disponível dentro do app — faça isso pelo painel do Supabase em Authentication → Users.</p>`;
    container.querySelector("#btn-novo-user").addEventListener("click", ()=> openUsuarioModal(null, build));
    container.querySelectorAll(".edit-user-btn").forEach(b=> b.addEventListener("click", ()=>{
      openUsuarioModal(STATE.users.find(u=>u.id===b.dataset.id), build);
    }));
    wireTopScroll(container);
  }
  build();
}

/* ============================== Contas Bancárias ============================== */
function contaBancariaFormHTML(item){
  return `
    <form id="cb-form">
      <label class="field"><span class="field-label">Nome da conta</span>
        <input class="input" id="cb-nome" placeholder="ex: Conta Principal" value="${esc(item?item.nome:"")}" /></label>
      <label class="field"><span class="field-label">Banco</span>
        <input class="input" id="cb-banco" placeholder="ex: Banco do Brasil, Itaú, Nubank..." value="${esc(item?item.banco:"")}" /></label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px;">
        <label class="field"><span class="field-label">Responsável</span>
          <input class="input" id="cb-responsavel" placeholder="Quem administra a conta" value="${esc(item?item.responsavel:"")}" /></label>
        <label class="field"><span class="field-label">Número da conta</span>
          <input class="input" id="cb-numero" placeholder="Agência / conta" value="${esc(item?item.numero_conta:"")}" /></label>
      </div>
      <label class="field"><span class="field-label">Saldo atual (R$)</span>
        <input class="input" type="number" step="0.01" id="cb-saldo" placeholder="0,00" value="${item&&item.saldo!=null?item.saldo:""}" /></label>
      <p class="field-hint">Nenhum campo é obrigatório — preencha o que tiver disponível agora e complete depois.</p>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px;">
        <button type="button" class="btn btn-outline" id="cb-cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="cb-submit">${icon("check",15)} Salvar conta</button>
      </div>
    </form>`;
}
function openContaBancariaModal(item, onSaved){
  openModal({
    title: item ? "Editar conta bancária" : "Nova conta bancária",
    bodyHTML: contaBancariaFormHTML(item),
    mount:(body)=>{
      body.querySelector("#cb-cancel").addEventListener("click", closeModal);
      body.querySelector("#cb-form").addEventListener("submit", async (e)=>{
        e.preventDefault();
        const payload = {
          nome: body.querySelector("#cb-nome").value.trim() || null,
          banco: body.querySelector("#cb-banco").value.trim() || null,
          responsavel: body.querySelector("#cb-responsavel").value.trim() || null,
          numero_conta: body.querySelector("#cb-numero").value.trim() || null,
          saldo: body.querySelector("#cb-saldo").value==="" ? 0 : parseFloat(body.querySelector("#cb-saldo").value) || 0,
        };
        const btn = body.querySelector("#cb-submit");
        btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Salvando...`;
        try{
          if(item) await editContaBancaria(item.id, payload);
          else await addContaBancaria(payload);
          closeModal(); onSaved && onSaved();
        }catch(err){ toast(err.message, true); btn.disabled=false; btn.innerHTML = `${icon("check",15)} Salvar conta`; }
      });
    }
  });
}
function contaBancariaCardHTML(c){
  const saldo = Number(c.saldo)||0;
  return `
    <div class="card conta-bancaria-card" data-id="${c.id}" style="padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
        <div style="min-width:0;">
          <p style="margin:0;font-weight:600;color:${BRAND[800]};font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(c.nome||"Conta sem nome")}</p>
          <p style="margin:2px 0 0;font-size:12px;color:#a8a29e;">${esc(c.banco||"Banco não informado")}</p>
        </div>
        <div style="display:flex;gap:2px;flex-shrink:0;">
          <button class="icon-btn edit-contabanc-btn" data-id="${c.id}">${icon("edit",15,"#78716c")}</button>
          <button class="icon-btn danger del-contabanc-btn" data-id="${c.id}">${icon("trash",15,DANGER)}</button>
        </div>
      </div>
      <p style="margin:0;font-size:22px;font-weight:700;color:${saldo>=0?BRAND[600]:DANGER};">${currency(saldo)}</p>
      <div style="border-top:1px solid var(--border);padding-top:8px;display:flex;flex-direction:column;gap:2px;">
        <p style="margin:0;font-size:12px;color:#78716c;">${esc(c.responsavel||"Responsável não informado")}</p>
        <p style="margin:0;font-size:12px;color:#a8a29e;">${c.numero_conta?`Conta ${esc(c.numero_conta)}`:"Número não informado"}</p>
      </div>
    </div>`;
}
function renderContasBancarias(container){
  function refresh(){
    const contas = STATE.contasBancarias;
    const total = saldoTotalContas();
    container.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;">
        <div>
          <h2 class="serif" style="margin:0;font-size:24px;color:${BRAND[800]};">Contas Bancárias</h2>
          <p class="muted" style="margin:4px 0 0;font-size:13px;">Saldo das contas bancárias da empresa, usado como referência de caixa disponível.</p>
        </div>
        <button class="btn btn-primary" id="btn-nova-conta-bancaria">${icon("plus",16)} Adicionar conta</button>
      </div>
      ${contas.length ? `
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:18px;">
        ${contas.map(contaBancariaCardHTML).join("")}
      </div>
      <div class="card" style="padding:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
        <span style="font-size:14px;color:#57534e;font-weight:500;">Total em contas bancárias (${contas.length} conta${contas.length>1?"s":""})</span>
        <span style="font-size:22px;font-weight:700;color:${total>=0?BRAND[600]:DANGER};">${currency(total)}</span>
      </div>` : `<div class="card empty" style="border-style:dashed;padding:60px 10px;">Nenhuma conta bancária cadastrada ainda. Clique em "Adicionar conta" para começar.</div>`}`;

    container.querySelector("#btn-nova-conta-bancaria").addEventListener("click", ()=> openContaBancariaModal(null, refresh));
    container.querySelectorAll(".edit-contabanc-btn").forEach(b=> b.addEventListener("click", (e)=>{
      e.stopPropagation();
      const item = STATE.contasBancarias.find(c=>c.id===b.dataset.id);
      openContaBancariaModal(item, refresh);
    }));
    container.querySelectorAll(".del-contabanc-btn").forEach(b=> b.addEventListener("click", (e)=>{
      e.stopPropagation();
      const item = STATE.contasBancarias.find(c=>c.id===b.dataset.id);
      openConfirm(`Excluir a conta "${item.nome||item.banco||"sem nome"}"? Essa ação não pode ser desfeita.`, async ()=>{
        try{ await deleteContaBancaria(item.id); refresh(); }catch(err){ toast(err.message, true); }
      });
    }));
    container.querySelectorAll(".conta-bancaria-card").forEach(card=> card.addEventListener("click", (e)=>{
      if(e.target.closest(".icon-btn")) return;
      const item = STATE.contasBancarias.find(c=>c.id===card.dataset.id);
      if(item) openContaBancariaModal(item, refresh);
    }));
  }
  refresh();
}

/* ============================== Boot ============================== */
bootstrap();
</script>
</body>
</html>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --b900:#12332570; --b800:#173c2c; --b700:#1f5c42; --b600:#2b7551; --b500:#3d9068;
    --b400:#5aab82; --b200:#bfe0cd; --b100:#e4f3ea; --b50:#f6faf7;
    --danger:#b3452f; --danger-bg:#fdf0ee; --warn:#93630f; --warn-bg:#fbf1e2;
    --ink:#1c2622; --muted:#78716c; --muted2:#a8a29e; --border:#f1efe9;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Inter',sans-serif; color:var(--ink); background:#fbfaf7;}
  .serif{font-family:'Fraunces',serif;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:14px;}
  a{color:inherit;}

  .btn{display:inline-flex; align-items:center; gap:6px; justify-content:center; border:none; border-radius:10px; padding:9px 14px; font-size:14px; font-weight:500; transition:transform .05s ease;}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:.6; cursor:default;}
  .btn-primary{background:var(--b600); color:#fff;}
  .btn-primary:hover{background:var(--b700);}
  .btn-outline{background:#fff; color:var(--b700); border:1px solid var(--b200);}
  .btn-outline:hover{background:var(--b50);}
  .btn-danger{background:var(--danger-bg); color:var(--danger);}
  .btn-danger:hover{filter:brightness(0.97);}
  .btn-ghost{background:transparent; color:var(--b700);}
  .icon-btn{padding:6px; border-radius:8px; border:none; background:transparent; display:inline-flex;}
  .icon-btn:hover{background:#f5f4f0;}
  .icon-btn.danger:hover{background:var(--danger-bg); color:var(--danger);}

  .field{display:block; margin-bottom:12px;}
  .field-label{display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; color:var(--b700); margin-bottom:4px;}
  .field-hint{display:block; font-size:11px; color:#a8a29e; margin-top:4px;}
  .input, select.input, textarea.input{
    width:100%; border:1px solid #e7e5e0; background:#fff; border-radius:8px; padding:9px 11px;
    outline:none; color:var(--ink); transition:box-shadow .1s;
  }
  .input:focus{box-shadow:0 0 0 3px var(--b100); border-color:var(--b400);}

  .card{background:#fff; border:1px solid var(--border); border-radius:16px;}

  .badge{display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:2px 9px; font-size:11px; font-weight:600;}
  .badge-ok{background:var(--b100); color:var(--b700);}
  .badge-pending{background:var(--warn-bg); color:var(--warn);}
  .dot{width:6px; height:6px; border-radius:999px; display:inline-block;}

  table{width:100%; min-width:max-content; border-collapse:collapse; font-size:14px;}
  thead th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:#a8a29e; padding:11px 14px; border-bottom:1px solid var(--border); white-space:nowrap;}
  thead th.th-sort:hover{color:var(--b700);}
  tbody td{padding:11px 14px; border-bottom:1px solid #faf9f6; white-space:nowrap;}
  tbody tr:hover{background:#fafaf8;}
  .top-scrollbar{overflow-x:auto; overflow-y:hidden; height:14px; margin-bottom:6px;}

  #root{min-height:100vh;}
  .app-shell{min-height:100vh; display:flex;}
  .sidebar{width:250px; flex-shrink:0; background:#fff; border-right:1px solid var(--border); display:flex; flex-direction:column; position:sticky; top:0; height:100vh;}
  .sidebar-brand{padding:22px 18px; border-bottom:1px solid var(--border); text-align:center;}
  .sidebar-nav{flex:1; padding:14px 10px; overflow-y:auto;}
  .nav-item{width:100%; display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; border:none; background:transparent; color:#44544c; font-size:14px; font-weight:500; margin-bottom:3px; text-align:left;}
  .nav-item:hover{background:var(--b50);}
  .nav-item.active{background:var(--b600); color:#fff;}
  .nav-group-toggle.active-group{color:var(--b700); background:var(--b50);}
  .nav-subitems{padding-left:10px; margin-bottom:2px;}
  .nav-subitem{padding-left:22px; font-size:13.5px;}
  .sidebar-foot{padding:14px 16px; border-top:1px solid var(--border);}
  .avatar{width:32px; height:32px; border-radius:999px; background:var(--b500); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; flex-shrink:0;}
  main.view{flex:1; padding:28px 32px; min-width:0;}

  .stat-card{background:#fff; border:1px solid var(--border); border-radius:16px; padding:14px; display:flex; align-items:center; gap:12px;}
  .stat-icon{border-radius:12px; padding:9px; display:flex;}
  .stat-label{font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:#a8a29e; font-weight:600; margin:0 0 2px;}
  .stat-value{font-size:17px; font-weight:600; color:#292524; margin:0;}

  .grid-4{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .grid-3{display:grid; grid-template-columns:1fr; gap:14px;}
  .grid-2{display:grid; grid-template-columns:1fr; gap:14px;}
  @media(min-width:900px){
    .grid-4{grid-template-columns:repeat(4,1fr);}
    .grid-3{grid-template-columns:repeat(3,1fr);}
    .grid-2{grid-template-columns:1fr 1fr;}
  }

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.32); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;}
  .modal{background:#fff; border-radius:18px; width:100%; max-width:460px; box-shadow:0 20px 50px rgba(0,0,0,.15); max-height:88vh; display:flex; flex-direction:column;}
  .modal.wide{max-width:780px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);}
  .modal-body{padding:20px; overflow-y:auto;}
  .confirm-box{background:#fff; border-radius:18px; width:100%; max-width:380px; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,.15);}

  .filter-bar{background:#fff; border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:16px; display:grid; grid-template-columns:1fr; gap:10px;}
  @media(min-width:900px){ .filter-bar{grid-template-columns:1.6fr .8fr .8fr 1fr 1fr .8fr;} }

  .conta-tabs{display:flex; gap:6px; margin-bottom:18px; overflow-x:auto; padding-bottom:2px;}
  .conta-tab{flex-shrink:0; padding:8px 18px; border-radius:999px; border:1px solid var(--border); background:#fff; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap; transition:background .12s,color .12s,border-color .12s;}
  .conta-tab:hover{border-color:var(--b400); color:var(--b700);}
  .conta-tab.active{background:var(--b600); border-color:var(--b600); color:#fff;}

  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--b50);}
  .login-box{width:100%; max-width:360px;}

  .empty{text-align:center; color:#a8a29e; padding:40px 10px; font-size:14px; white-space:normal;}
  .muted{color:#a8a29e;}
  .list-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 16px; border-bottom:1px solid #faf9f6;}
  .list-row:last-child{border-bottom:none;}

  .toast{position:fixed; bottom:20px; right:20px; z-index:100; background:#292524; color:#fff; font-size:13px; padding:10px 16px; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.2); max-width:320px;}
  .toast.error{background:var(--danger);}

function ordenarPor(lista, state, extractors){
  const ext = extractors[state.key];
  if(!ext) return lista;
  const copia = [...lista].sort((a,b)=>{
    const va = ext(a), vb = ext(b);
    if(va==null && vb==null) return 0;
    if(va==null) return 1;
    if(vb==null) return -1;
    if(typeof va==="number" && typeof vb==="number") return va-vb;
    return String(va).localeCompare(String(vb), "pt-BR", {sensitivity:"base", numeric:true});
  });

/* ---- Barra de scroll horizontal duplicada no topo da tabela ----
   O scroll nativo do navegador fica embaixo da tabela, que pode ser bem
   comprida — obrigando a rolar a página inteira até o fim só para achar a
   barra. Esta função cria uma barrinha fina logo acima da tabela, com a
   mesma largura de rolagem, sincronizada nos dois sentidos. */
function wireTopScroll(container){
  container.querySelectorAll(".card").forEach(card=>{
    const table = card.firstElementChild;
    if(!table || table.tagName!=="TABLE") return; // só cards cuja tabela é o conteúdo principal
    if(table.scrollWidth <= card.clientWidth + 1) return; // cabe inteira, sem necessidade de barra
    const bar = document.createElement("div");
    bar.className = "top-scrollbar";
    bar.innerHTML = `<div style="width:${table.scrollWidth}px;height:1px;"></div>`;
    card.parentNode.insertBefore(bar, card);
    let sincronizando = false;
    bar.addEventListener("scroll", ()=>{ if(sincronizando) return; sincronizando=true; card.scrollLeft = bar.scrollLeft; sincronizando=false; });
    card.addEventListener("scroll", ()=>{ if(sincronizando) return; sincronizando=true; bar.scrollLeft = card.scrollLeft; sincronizando=false; });
  });
}

/* ---- Autenticação de 2 fatores (TOTP via Supabase Auth) ---- */
function decodeJwt(token){
  try{
    const payload = token.split(".")[1];
    const base64 = payload.replace(/-/g,"+").replace(/_/g,"/");
    const json = decodeURIComponent(atob(base64).split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""));
    return JSON.parse(json);
  }catch(e){ return {}; }
}
async function sbAuthRequest(path, accessToken, {method="GET", body}={}){
  const res = await fetch(`${SB_URL}/auth/v1${path}`, {
    method,
    headers:{ apikey:SB_ANON_KEY, Authorization:`Bearer ${accessToken}`, "Content-Type":"application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if(res.status===204) return null;
  const data = await res.json().catch(()=>null);
  if(!res.ok) throw new Error((data && (data.msg || data.error_description || data.message)) || "Erro na verificação em duas etapas.");
  return data;
}

async function sbFetch(path, {method="GET", body, retry=true}={}){
  const doFetch = (token) => fetch(`${SB_URL}${path}`, {
    method,
    headers:{
      apikey: SB_ANON_KEY,
      Authorization: `Bearer ${token}`,
      "Content-Type":"application/json",
      ...(method!=="GET" ? {"Prefer":"return=representation"} : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });

  let res = await doFetch(STATE.session.access_token);
  if(res.status===401 && retry && STATE.session.refresh_token){
    try{
      const fresh = await sbAuthRefresh(STATE.session.refresh_token);
      STATE.session = {...STATE.session, ...fresh};
      await saveRefreshToken(fresh.refresh_token);
      res = await doFetch(STATE.session.access_token);
    }catch(e){
      STATE.session = null; STATE.currentUser = null;
      renderRoot();
      throw new Error("Sua sessão expirou. Faça login novamente.");
    }
  }
  if(res.status===204) return null;
  const data = await res.json().catch(()=>null);
  if(!res.ok) throw new Error((data && (data.message || data.error_description || data.msg)) || "Erro ao comunicar com o banco de dados.");
  return data;
}

// Busca TODAS as linhas de uma tabela, paginando por "offset" até vir uma
// página vazia. Isso evita que um limite de linhas por requisição configurado
// no Supabase (Project Settings → API → Max Rows) corte a lista pela metade —
// cada página traz o que o servidor permitir, e a busca continua até acabar.
async function sbFetchAll(path){
  const PEDIDO = 1000; // quanto pedimos por página; se o servidor tiver um
  // limite menor (Max Rows), ele devolve menos — por isso não paramos ao
  // receber menos que PEDIDO, e sim quando uma página vier vazia.
  let offset = 0, all = [], guard = 0;
  while(guard++ < 500){ // trava de segurança (até 500 páginas) contra loop infinito
    const sep = path.includes("?") ? "&" : "?";
    const pagina = await sbFetch(`${path}${sep}limit=${PEDIDO}&offset=${offset}`);
    if(!pagina || pagina.length===0) break;
    all = all.concat(pagina);
    offset += pagina.length;
  }
  return all;
}

/* ---- Consulta pública de CNPJ (BrasilAPI) — usada nos cadastros de
   Fornecedores e Clientes para preencher nome/telefone/endereço automaticamente ---- */
function formatarCNPJ(valor){
  const d = String(valor||"").replace(/\D/g,"");
  if(d.length!==14) return valor;
  return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}`;
}
function formatarTelefoneConsulta(raw){
  const d = String(raw||"").replace(/\D/g,"");
  if(d.length<10) return "";
  const ddd = d.slice(0,2), numero = d.slice(2);
  return numero.length>=9 ? `(${ddd}) ${numero.slice(0,5)}-${numero.slice(5)}` : `(${ddd}) ${numero.slice(0,4)}-${numero.slice(4)}`;
}
function enderecoConsultaCNPJ(d){
  return [
    [d.logradouro, d.numero].filter(Boolean).join(", "),
    d.bairro,
    (d.municipio && d.uf) ? `${d.municipio}/${d.uf}` : (d.municipio || d.uf || ""),
    d.cep ? `CEP ${d.cep}` : "",
  ].filter(Boolean).join(" - ");
}
async function consultarCNPJ(cnpjRaw){
  const cnpj = String(cnpjRaw||"").replace(/\D/g,"");
  if(cnpj.length!==14) throw new Error("Informe um CNPJ válido (14 dígitos) — CPF não pode ser consultado.");
  let res;
  try{ res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`); }
  catch(e){ throw new Error("Não foi possível acessar o serviço de consulta agora. Verifique sua conexão."); }
  if(res.status===404) throw new Error("CNPJ não encontrado na Receita Federal.");
  if(!res.ok) throw new Error("Não foi possível consultar esse CNPJ agora. Tente novamente em instantes.");
  return res.json();
}
// Liga o botão "Consultar" de um formulário de cadastro (Fornecedor/Cliente) ao
// preenchimento automático de nome, telefone e endereço a partir do CNPJ.
function wireConsultaCNPJ(body, ids){
  const btn = body.querySelector(ids.btn);
  const docInput = body.querySelector(ids.documento);
  if(!btn || !docInput) return;
  btn.addEventListener("click", async ()=>{
    const original = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = `<span class="spinner"></span>`;
    try{
      const dados = await consultarCNPJ(docInput.value);
      docInput.value = formatarCNPJ(dados.cnpj || docInput.value);
      const nomeInput = body.querySelector(ids.nome);
      if(nomeInput) nomeInput.value = dados.nome_fantasia || dados.razao_social || nomeInput.value;
      const telInput = body.querySelector(ids.telefone);
      if(telInput && !telInput.value.trim()){
        const tel = formatarTelefoneConsulta(dados.ddd_telefone_1);
        if(tel) telInput.value = tel;
      }
      const obsInput = body.querySelector(ids.observacoes);
      if(obsInput && !obsInput.value.trim()){
        const endereco = enderecoConsultaCNPJ(dados);
        if(endereco) obsInput.value = endereco;
      }
      const situacao = dados.descricao_situacao_cadastral;
      const aviso = situacao && situacao.toUpperCase()!=="ATIVA" ? ` · Atenção: situação cadastral "${situacao}"` : "";
      toast(`Dados do CNPJ preenchidos${aviso}.`, !!aviso);
    }catch(err){ toast(err.message, true); }
    finally{ btn.disabled=false; btn.innerHTML = original; }
  });
}

/* ---- Gerenciar categorias ---- */
function openCategoriasModal(tipo, onChanged){
  function bodyHTML(){
    const lista = STATE.categorias.filter(c=>c.tipo===tipo).sort((a,b)=>a.nome.localeCompare(b.nome));
    return `
      <form id="cat-add-form" style="display:flex;gap:8px;margin-bottom:14px;">
        <input class="input" id="cat-nova" placeholder="Nome da nova categoria" required />
        <button type="submit" class="btn btn-primary" style="flex-shrink:0;">${icon("plus",15)} Adicionar</button>
      </form>
      <div id="cat-list">
        ${lista.map(c=>`
          <div class="list-row" data-catrow="${c.id}">
            <span class="cat-nome" style="font-size:14px;color:#44403c;flex:1;">${esc(c.nome)}</span>
            <div style="display:flex;gap:2px;">
              <button class="icon-btn cat-edit-btn" data-id="${c.id}">${icon("edit",15,"#78716c")}</button>
              <button class="icon-btn danger cat-del-btn" data-id="${c.id}">${icon("trash",15,DANGER)}</button>
            </div>
          </div>`).join("") || `<p class="empty">Nenhuma categoria cadastrada ainda.</p>`}
      </div>
      <p class="field-hint" style="margin-top:10px;">Excluir uma categoria não altera lançamentos já criados com ela — só deixa de aparecer nas opções para novos lançamentos.</p>`;
  }

  function mount(body){
    body.querySelector("#cat-add-form").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const input = body.querySelector("#cat-nova");
      const nome = input.value.trim();
      if(!nome) return;
      try{
        await addCategoria(tipo, nome);
        body.innerHTML = bodyHTML(); mount(body);
        onChanged && onChanged();
      }catch(err){
        toast(/duplicate|unique/i.test(err.message) ? "Essa categoria já existe." : err.message, true);
      }
    });
    body.querySelectorAll(".cat-edit-btn").forEach(b=> b.addEventListener("click", ()=>{
      const row = body.querySelector(`[data-catrow="${b.dataset.id}"]`);
      const cat = STATE.categorias.find(c=>c.id===b.dataset.id);
      row.innerHTML = `
        <input class="input cat-edit-input" value="${esc(cat.nome)}" style="flex:1;" />
        <div style="display:flex;gap:2px;">
          <button class="icon-btn cat-save-btn">${icon("check",15,BRAND[600])}</button>
          <button class="icon-btn cat-cancelEdit-btn">${icon("x",15,"#78716c")}</button>
        </div>`;
      row.querySelector(".cat-save-btn").addEventListener("click", async ()=>{
        const novoNome = row.querySelector(".cat-edit-input").value.trim();
        if(!novoNome) return;
        try{
          await editCategoria(cat.id, novoNome);
          body.innerHTML = bodyHTML(); mount(body);
          onChanged && onChanged();
        }catch(err){
          toast(/duplicate|unique/i.test(err.message) ? "Essa categoria já existe." : err.message, true);
        }
      });
      row.querySelector(".cat-cancelEdit-btn").addEventListener("click", ()=>{ body.innerHTML = bodyHTML(); mount(body); });
    }));
    body.querySelectorAll(".cat-del-btn").forEach(b=> b.addEventListener("click", ()=>{
      const cat = STATE.categorias.find(c=>c.id===b.dataset.id);
      openConfirm(`Excluir a categoria "${cat.nome}"?`, async ()=>{
        try{
          await deleteCategoria(cat.id);
          body.innerHTML = bodyHTML(); mount(body);
          onChanged && onChanged();
        }catch(err){ toast(err.message, true); }
      });
    }));
  }

  openNestedModal({ title:`Categorias — ${TIPO_LABEL[tipo]}`, bodyHTML: bodyHTML(), mount });
}

/* ============================== Modal / Confirm ============================== */
function closeModal(){ const m=document.getElementById("modal-overlay"); if(m) m.remove(); }
function openModal({title, wide, bodyHTML, mount}){
  closeModal();
  const div = document.createElement("div");
  div.id = "modal-overlay";
  div.className = "overlay";
  div.innerHTML = `
    <div class="modal ${wide?"wide":""}">
      <div class="modal-head">

      </div>
      <div class="modal-body">${bodyHTML}</div>
    </div>`;
  document.body.appendChild(div);
  div.addEventListener("mousedown", (e)=>{ if(e.target===div) closeModal(); });
  document.getElementById("modal-close").addEventListener("click", closeModal);
  if(mount) mount(div.querySelector(".modal-body"));
}

function closeConfirm(){ const c=document.getElementById("confirm-overlay"); if(c) c.remove(); }
function openConfirm(text, onConfirm){
  closeConfirm();

  div.id = "confirm-overlay";
  div.className = "overlay";
  div.style.zIndex = "70";
  div.innerHTML = `
    <div class="confirm-box">

function brandMark(size){
  return `
    <div style="display:flex;flex-direction:column;align-items:center;">
      <img src="${P_ICON_B64}" alt="Paulu's" style="width:${size}px;height:auto;display:block;" />
      <span class="serif" style="margin-top:4px;font-size:22px;letter-spacing:.02em;color:${BRAND[600]};">Paulu's</span>
    </div>`;
}

function renderLogin(root){
  root.innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <div style="text-align:center;margin-bottom:22px;">
          ${brandMark(60)}
          <p class="serif" style="font-style:italic;color:#78716c;margin-top:6px;font-size:14px;">Gestão Financeira</p>
        </div>
        <form id="login-form" class="card" style="padding:22px;">
          <label class="field">
            <span class="field-label">E-mail</span>
            <input class="input" id="li-user" type="email" placeholder="voce@empresa.com" autocomplete="username" autofocus />
          </label>
          <label class="field">
            <span class="field-label">Senha</span>
            <input class="input" id="li-pass" type="password" placeholder="••••••••" autocomplete="current-password" />
          </label>
          <p id="li-err" style="color:${DANGER};font-size:12px;display:none;margin:0 0 10px;"></p>
          <button class="btn btn-primary" style="width:100%;" type="submit" id="li-submit">Entrar</button>
        </form>
        <p class="muted" style="text-align:center;font-size:11px;margin-top:14px;">
          Acesso via Supabase — use o e-mail e senha cadastrados pelo administrador.
        </p>
      </div>
    </div>`;
  document.getElementById("login-form").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const email = document.getElementById("li-user").value.trim();
    const pass = document.getElementById("li-pass").value;
    const errEl = document.getElementById("li-err");
    const btn = document.getElementById("li-submit");
    errEl.style.display = "none";
    btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Entrando...`;
    try{
      const session = await sbAuthLogin(email, pass);
      const claims = decodeJwt(session.access_token);
      if(claims.aal==="aal1"){
        const factores = await mfaListFactors(session.access_token);
        const totp = factores.find(f=>f.factor_type==="totp" && f.status==="verified");
        if(totp){ renderLoginMfaStep(root, session, totp.id); return; }
      }
      STATE.session = session;
      await saveRefreshToken(session.refresh_token);
      await loadProfileAndData();
      renderRoot();
    }catch(err){
      errEl.textContent = err.message;
      errEl.style.display = "block";
      btn.disabled = false; btn.textContent = "Entrar";
    }
  });
}

function renderLoginMfaStep(root, session, factorId){
  root.innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <div style="text-align:center;margin-bottom:22px;">
          ${brandMark(60)}
          <p class="serif" style="font-style:italic;color:#78716c;margin-top:6px;font-size:14px;">Verificação em duas etapas</p>
        </div>
        <form id="mfa-login-form" class="card" style="padding:22px;">
          <p class="muted" style="font-size:13px;margin:0 0 14px;">Abra seu app autenticador (Google Authenticator, Authy...) e digite o código de 6 dígitos.</p>
          <label class="field">
            <span class="field-label">Código</span>
            <input class="input" id="mfa-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autofocus style="letter-spacing:6px;font-size:18px;text-align:center;" />
          </label>
          <p id="mfa-err" style="color:${DANGER};font-size:12px;display:none;margin:0 0 10px;"></p>
          <button class="btn btn-primary" style="width:100%;" type="submit" id="mfa-submit">Confirmar</button>
          <button class="btn btn-ghost" style="width:100%;margin-top:6px;" type="button" id="mfa-voltar">Voltar ao login</button>
        </form>
      </div>
    </div>`;
  document.getElementById("mfa-voltar").addEventListener("click", ()=> renderLogin(root));
  document.getElementById("mfa-login-form").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const code = document.getElementById("mfa-code").value.trim();
    const errEl = document.getElementById("mfa-err");
    const btn = document.getElementById("mfa-submit");
    errEl.style.display = "none";
    if(!/^\d{6}$/.test(code)){ errEl.textContent = "Digite os 6 dígitos do código."; errEl.style.display = "block"; return; }
    btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Confirmando...`;
    try{
      const challenge = await mfaChallenge(session.access_token, factorId);
      const verified = await mfaVerify(session.access_token, factorId, challenge.id, code);
      STATE.session = verified;
      await saveRefreshToken(verified.refresh_token);
      await loadProfileAndData();
      renderRoot();
    }catch(err){
      errEl.textContent = /invalid|expired/i.test(err.message) ? "Código inválido ou expirado. Tente novamente." : err.message;
      errEl.style.display = "block";
      btn.disabled = false; btn.textContent = "Confirmar";
    }
  });
}

// Contas e Análise Personalizada) reúne várias "contas" por trás de um menu
// deslizante. O acesso de cada aba continua checado pelo id granular de sempre
// (ex: "fat-entradas"), então as permissões de cada usuário não mudam.
const FIN_SUBACESSOS = {
  "fin-dashboard": ["dashboard","cartoes-dashboard","vales-dashboard","fat-dashboard"],
  "fin-entradas": ["entradas","vales-lancamentos","fat-entradas"],
  "fin-saidas": ["saidas","cartoes-lancamentos","fat-saidas"],
  "fin-contas": ["contas","fat-contas"],
  "fin-personalizado": ["personalizado","fat-personalizado"],
};
// Estrutura granular usada só no editor de permissões e nos resumos de acesso
// (a navegação lateral agora é mais enxuta, mas quem libera o quê pra cada
// usuário continua escolhendo conta por conta, tela por tela).
const PERMISSOES_GRUPOS = [
  { id:"financeiro", label:"Financeiro", ic:"clipboard", subgrupos:[
    { label:"Painel Principal", items:[
      {id:"dashboard", label:"Carteira"},
      {id:"cartoes-dashboard", label:"Cartões"},
      {id:"vales-dashboard", label:"Vales"},
      {id:"fat-dashboard", label:"Faturamento"},
    ]},
    { label:"Entradas", items:[
      {id:"entradas", label:"Carteira"},
      {id:"vales-lancamentos", label:"Vales"},
      {id:"fat-entradas", label:"Faturamento"},
    ]},
    { label:"Saídas", items:[
      {id:"saidas", label:"Carteira"},
      {id:"cartoes-lancamentos", label:"Cartões"},
      {id:"fat-saidas", label:"Faturamento"},
    ]},
    { label:"Contas a Pagar/Receber", items:[
      {id:"contas", label:"Carteira"},
      {id:"fat-contas", label:"Faturamento"},
    ]},
    { label:"Duplicatas a Pagar", items:[
      {id:"fat-duplicatas", label:"Faturamento"},
    ]},
    { label:"Análise Personalizada", items:[
      {id:"personalizado", label:"Carteira"},
      {id:"fat-personalizado", label:"Faturamento"},
    ]},
  ]},
  { id:"cadastros", label:"Cadastros", ic:"folder", subgrupos:[
    { label:"Cadastros", items:[
      {id:"cad-cartoes", label:"Cartões"},
      {id:"cad-fornecedores", label:"Fornecedores"},
      {id:"cad-clientes", label:"Clientes"},
    ]},
  ]},
  { id:"config", label:"Configurações", ic:"settings", subgrupos:[
    { label:"Configurações", items:[
      {id:"contas-bancarias", label:"Contas Bancárias"},
    ]},
  ]},
];
function permItemsFlat(grupo){ return grupo.subgrupos.flatMap(sg=>sg.items); }

/* ============================== Perfis de acesso e permissões por aba/subaba ============================== */
const CARGO_LABEL = { usuario:"Usuário", admin:"Admin", super_admin:"Super Admin" };
function isAdminLevel(user){ return !!user && (user.cargo==="admin" || user.cargo==="super_admin"); }
function temAcessoView(user, viewId){
  if(!user || !viewId) return false;
  if(viewId==="seguranca") return true; // toda conta autenticada gerencia a própria segurança
  if(viewId==="usuarios") return isAdminLevel(user); // gestão de usuários é exclusiva de Admin/Super Admin
  if(isAdminLevel(user)) return true;
  if(FIN_SUBACESSOS[viewId]){
    // Tela unificada (Painel Principal/Entradas/Saídas/Contas/Análise
    // Personalizada): visível se o usuário tiver acesso a pelo menos uma
    // das contas por trás do menu deslizante.
    return FIN_SUBACESSOS[viewId].some(id=>Array.isArray(user.permissoes) && user.permissoes.includes(id));
  }
  return Array.isArray(user.permissoes) && user.permissoes.includes(viewId);
}
function temAcessoGrupo(user, groupId){
  if(!user || !groupId) return false;
  if(isAdminLevel(user)) return true;
  const g = NAV_GROUPS.find(gr=>gr.id===groupId);
  if(!g) return false;
  return g.items.some(it=>temAcessoView(user, it.id));
}
function cargoBadge(cargo){
  const label = esc(CARGO_LABEL[cargo] || cargo);
  if(cargo==="super_admin") return `<span class="badge" style="background:${BRAND[800]};color:#fff;">${label}</span>`;
  if(cargo==="admin") return `<span class="badge badge-ok">${label}</span>`;
  return `<span class="badge badge-pending">${label}</span>`;
}
function permissoesBadges(u){
  if(isAdminLevel(u)) return `<span class="badge badge-ok"><span class="dot" style="background:${BRAND[500]}"></span>Acesso total</span>`;
  const perms = u.permissoes || [];
  const partes = [];
  PERMISSOES_GRUPOS.forEach(g=>{
    const todosItens = permItemsFlat(g);
    const itensPermitidos = todosItens.filter(it=>perms.includes(it.id));
    if(!itensPermitidos.length) return;
    if(itensPermitidos.length===todosItens.length){
      partes.push(`<span class="badge badge-pending" style="margin:1px 4px 1px 0;">${esc(g.label)}</span>`);
    }else{
      partes.push(`<span class="badge badge-pending" style="margin:1px 4px 1px 0;" title="${esc(itensPermitidos.map(it=>it.label).join(", "))}">${esc(g.label)} (${itensPermitidos.length}/${todosItens.length})</span>`);
    }
  });
  if(!partes.length) return `<span class="muted" style="font-size:12px;">Nenhum acesso liberado</span>`;
  return partes.join("");
}

function renderSidebar(){
  const sb = document.getElementById("sidebar");
  const prevNav = sb.querySelector(".sidebar-nav");
  const prevScrollTop = prevNav ? prevNav.scrollTop : 0;
  const groupHTML = NAV_GROUPS.map(g=>{
    const itensVisiveis = g.items.filter(it=>temAcessoView(STATE.currentUser, it.id));
    if(!itensVisiveis.length) return "";
    const hasActive = itensVisiveis.some(it=>it.id===STATE.view);
    const open = STATE.navOpen[g.id]===true ? true : (STATE.navOpen[g.id]===false ? false : hasActive);
    return `
      <div class="nav-group">
        <button class="nav-item nav-group-toggle ${hasActive?"active-group":""}" data-group="${g.id}">
          ${icon(g.ic,17)} <span style="flex:1;text-align:left;">${esc(g.label)}</span>
          <span style="transform:rotate(${open?90:0}deg);transition:transform .15s;display:inline-flex;">${icon("chevron",14)}</span>
        </button>
        <div class="nav-subitems" style="display:${open?"block":"none"};">
          ${itensVisiveis.map(it=>`
            <button class="nav-item nav-subitem ${STATE.view===it.id?"active":""}" data-view="${it.id}">
              ${icon(it.ic,15)} ${esc(it.label)}
            </button>`).join("")}
        </div>
      </div>`;
  }).join("");
  const semAbasHTML = !groupHTML ? `<p class="muted" style="font-size:12px;padding:10px 12px;">Nenhuma aba liberada ainda. Fale com um Admin.</p>` : "";
  sb.innerHTML = `
    <div class="sidebar-brand">${brandMark(34)}</div>
    <nav class="sidebar-nav">${groupHTML}${semAbasHTML}</nav>
    <div class="sidebar-foot">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <div class="avatar">${esc(STATE.currentUser.nome.slice(0,1).toUpperCase())}</div>
        <div style="min-width:0;">
          <p style="margin:0;font-size:12px;font-weight:600;color:#44403c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(STATE.currentUser.nome)}</p>
          <p style="margin:0;font-size:11px;color:#a8a29e;">${esc(CARGO_LABEL[STATE.currentUser.cargo] || STATE.currentUser.cargo)}</p>
        </div>
      </div>
      <button class="btn btn-outline" style="width:100%;" id="btn-logout">${icon("logout",15)} Sair</button>
    </div>`;
  const newNav = sb.querySelector(".sidebar-nav");
  if(newNav) newNav.scrollTop = prevScrollTop;
  sb.querySelectorAll(".nav-group-toggle").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const g = btn.dataset.group;
      const grupo = NAV_GROUPS.find(x=>x.id===g);
      const hasActive = grupo ? grupo.items.some(it=>it.id===STATE.view) : false;
      const abertoAgora = STATE.navOpen[g]===true ? true : (STATE.navOpen[g]===false ? false : hasActive);
      STATE.navOpen[g] = !abertoAgora;
      renderSidebar();
    });
  });
  sb.querySelectorAll(".nav-subitem, .nav-item[data-view]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ STATE.view = btn.dataset.view; renderSidebar(); renderView(); });
  });
  document.getElementById("btn-logout").addEventListener("click", async ()=>{
    STATE.session = null; STATE.currentUser = null; STATE.users=[]; STATE.lancamentos=[]; STATE.cartaoLancamentos=[]; STATE.valeLancamentos=[]; STATE.faturamentoLancamentos=[]; STATE.cartoes=[]; STATE.fornecedores=[]; STATE.clientes=[];
    await saveRefreshToken(null);
    renderRoot();
  });
}

function renderSemAcesso(container){
  container.innerHTML = `
    <div class="empty" style="padding:70px 10px;">
      ${icon("lock",30,"#d6d3cd")}
      <p style="margin-top:12px;font-size:14px;">Você não tem acesso a esta área.</p>
      <p style="margin-top:4px;font-size:13px;">Fale com um Admin ou Super Admin para liberar essa aba para o seu usuário.</p>
    </div>`;
}

/* ---- Menu deslizante de "conta" (Carteira/Cartões/Vales/Faturamento) ----
   Usado pelas telas unificadas do Financeiro (Painel Principal, Entradas,
   Saídas, Contas a Pagar/Receber e Análise Personalizada): mostra um menu de
   abas no topo da página e desenha, embaixo, a tela daquela conta — exatamente
   a mesma tela que já existia antes, sem nenhuma mudança de comportamento. */
function renderComAbasDeConta(container, storageKey, contas){
  const disponiveis = contas.filter(c=>temAcessoView(STATE.currentUser, c.acesso));
  if(!disponiveis.length){ renderSemAcesso(container); return; }
  let atual = STATE.contaTab[storageKey];
  if(!atual || !disponiveis.some(c=>c.id===atual)) atual = disponiveis[0].id;
  STATE.contaTab[storageKey] = atual;
  container.innerHTML = `
    <div class="conta-tabs">${disponiveis.map(c=>`<button type="button" class="conta-tab ${c.id===atual?"active":""}" data-conta="${c.id}">${esc(c.label)}</button>`).join("")}</div>
    <div id="conta-tab-body"></div>`;
  container.querySelectorAll(".conta-tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(btn.dataset.conta===STATE.contaTab[storageKey]) return;
      Object.keys(CHARTS).forEach(k=>{ CHARTS[k].destroy(); delete CHARTS[k]; });
      STATE.contaTab[storageKey] = btn.dataset.conta;
      renderComAbasDeConta(container, storageKey, contas);
    });
  });
  const selecionada = disponiveis.find(c=>c.id===atual);
  selecionada.render(container.querySelector("#conta-tab-body"));
}
function renderFinDashboard(container){
  renderComAbasDeConta(container, "dashboard", [
    {id:"dashboard", label:"Carteira", acesso:"dashboard", render:renderDashboard},
    {id:"cartoes-dashboard", label:"Cartões", acesso:"cartoes-dashboard", render:renderCartoesDashboard},
    {id:"vales-dashboard", label:"Vales", acesso:"vales-dashboard", render:renderValesDashboard},
    {id:"fat-dashboard", label:"Faturamento", acesso:"fat-dashboard", render:renderFatDashboard},
  ]);
}
function renderFinEntradas(container){
  renderComAbasDeConta(container, "entradas", [
    {id:"entradas", label:"Carteira", acesso:"entradas", render:(c)=>renderLancamentosView(c,"entrada")},
    {id:"vales-lancamentos", label:"Vales", acesso:"vales-lancamentos", render:renderValesLancamentos},
    {id:"fat-entradas", label:"Faturamento", acesso:"fat-entradas", render:(c)=>renderFatLancamentosView(c,"entrada")},
  ]);
}
function renderFinSaidas(container){
  renderComAbasDeConta(container, "saidas", [
    {id:"saidas", label:"Carteira", acesso:"saidas", render:(c)=>renderLancamentosView(c,"saida")},
    {id:"cartoes-lancamentos", label:"Cartões", acesso:"cartoes-lancamentos", render:renderCartoesLancamentos},
    {id:"fat-saidas", label:"Faturamento", acesso:"fat-saidas", render:(c)=>renderFatLancamentosView(c,"saida")},
  ]);
}
function renderFinContas(container){
  renderComAbasDeConta(container, "contas", [
    {id:"contas", label:"Carteira", acesso:"contas", render:renderContas},
    {id:"fat-contas", label:"Faturamento", acesso:"fat-contas", render:renderFatContas},
  ]);
}
function renderFinPersonalizado(container){
  renderComAbasDeConta(container, "personalizado", [
    {id:"personalizado", label:"Carteira", acesso:"personalizado", render:renderPersonalizado},
    {id:"fat-personalizado", label:"Faturamento", acesso:"fat-personalizado", render:renderFatPersonalizado},
  ]);
}

function renderView(){
  const c = document.getElementById("view-container");
  Object.keys(CHARTS).forEach(k=>{ CHARTS[k].destroy(); delete CHARTS[k]; });
  const autorizado = temAcessoView(STATE.currentUser, STATE.view);
  if(!autorizado){ renderSemAcesso(c); return; }
  if(STATE.view==="fin-dashboard") renderFinDashboard(c);
  else if(STATE.view==="fin-entradas") renderFinEntradas(c);
  else if(STATE.view==="fin-saidas") renderFinSaidas(c);
  else if(STATE.view==="fin-contas") renderFinContas(c);
  else if(STATE.view==="fat-duplicatas") renderFatDuplicatas(c);
  else if(STATE.view==="fin-personalizado") renderFinPersonalizado(c);
  else if(STATE.view==="cad-cartoes") renderCadCartoes(c);
  else if(STATE.view==="cad-fornecedores") renderCadFornecedores(c);
  else if(STATE.view==="cad-clientes") renderCadClientes(c);
  else if(STATE.view==="seguranca") renderSeguranca(c);
  else if(STATE.view==="usuarios") renderUsuarios(c);
  else if(STATE.view==="contas-bancarias") renderContasBancarias(c);
  else renderSemAcesso(c);
}

/* ============================== Stat card / badge helpers ============================== */
function statCard(label, value, iconName, tint, color){
  return `
    <div class="stat-card">
      <div class="stat-icon" style="background:${tint};">${icon(iconName,18,color)}</div>
      <div><p class="stat-label">${esc(label)}</p><p class="stat-value">${value}</p></div>
    </div>`;
}
/* ---- Seletor de período personalizado (usado nos dashboards) ---- */
function defaultPeriodoState(){
  const now = new Date();
  return { de: `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-01`, ate: todayISO(), todos: false };
}
function periodoPickerHTML(prefix, state){
  return `
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      ${icon("calendar",16,"#a8a29e")}
      <input class="input" type="date" id="${prefix}-de" style="width:auto;" value="${state.de}" ${state.todos?"disabled":""} />
      <span class="muted" style="font-size:13px;">até</span>
      <input class="input" type="date" id="${prefix}-ate" style="width:auto;" value="${state.ate}" ${state.todos?"disabled":""} />
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#57534e;cursor:pointer;">
        <input type="checkbox" id="${prefix}-todos" ${state.todos?"checked":""} style="width:15px;height:15px;" /> Todos os períodos
      </label>
    </div>`;
}
function wirePeriodoPicker(prefix, container, state, onChange){
  container.querySelector(`#${prefix}-de`).addEventListener("change",(e)=>{ state.de=e.target.value; onChange(); });
  container.querySelector(`#${prefix}-ate`).addEventListener("change",(e)=>{ state.ate=e.target.value; onChange(); });
  container.querySelector(`#${prefix}-todos`).addEventListener("change",(e)=>{ state.todos=e.target.checked; onChange(); });
}
function noPeriodoFn(state, dateOf){
  return (l) => state.todos ? true : ((d)=> d>=state.de && d<=state.ate)(dateOf(l));
}
function badge(status){
  const ok = status==="realizado";
  return `<span class="badge ${ok?"badge-ok":"badge-pending"}"><span class="dot" style="background:${ok?BRAND[500]:"#c9922c"}"></span>${ok?"Realizado":"Previsto"}</span>`;
}
function prazoBadge(l){
  if(!l.data_vencimento) return `<span class="muted" style="font-size:12px;">—</span>`;
  if(l.status==="realizado"){
    const emDia = !l.data_realizada || l.data_realizada<=l.data_vencimento;
    return emDia
      ? `<span class="badge badge-ok"><span class="dot" style="background:${BRAND[500]}"></span>Pago no prazo</span>`
      : `<span class="badge" style="background:${DANGER_BG};color:${DANGER};"><span class="dot" style="background:${DANGER}"></span>Pago com atraso</span>`;
  }
  const atrasado = l.data_vencimento < todayISO();
  return atrasado
    ? `<span class="badge" style="background:${INFO_BG};color:${INFO};"><span class="dot" style="background:${INFO}"></span>Atrasado</span>`
    : `<span class="badge badge-pending"><span class="dot" style="background:#c9922c"></span>No prazo</span>`;
}

/* ============================== Formulário de lançamento ============================== */
function lancamentoFormHTML(tipo, item){
  const cats = catsFor(tipo);
  const label = tipo==="entrada" ? "De quem (origem)" : "Para quem (fornecedor / destino)";
  const status = item?.status || "realizado";
  return `
    <form id="lanc-form">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px;">
        <label class="field"><span class="field-label">Valor (R$)</span>
          <input class="input" type="number" min="0" step="0.01" id="f-valor" value="${item?item.valor:""}" placeholder="0,00" required /></label>
        <label class="field">
          <span class="field-label">Categoria</span>
          <select class="input" id="f-categoria">${cats.map(c=>`<option value="${esc(c)}" ${item&&item.categoria===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
          ${manageCategoriasBtn(tipo)}
        </label>
      </div>
      <label class="field"><span class="field-label">${label}</span>
        <input class="input" id="f-contraparte" value="${esc(item?item.contraparte:"")}" placeholder="Nome do cliente, contrato ou fornecedor" required /></label>
      <label class="field"><span class="field-label">Unidade / Local</span>
        <input class="input" id="f-unidade" list="unidades-list" value="${esc(item?item.unidade:"")}" placeholder="ex: Unidade Centro" required />
        <datalist id="unidades-list">${Array.from(new Set(STATE.lancamentos.map(l=>l.unidade))).map(u=>`<option value="${esc(u)}">`).join("")}</datalist>
      </label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px;">
        <label class="field"><span class="field-label">Status</span>
          <select class="input" id="f-status">
            <option value="realizado" ${status==="realizado"?"selected":""}>Realizado</option>
            <option value="previsto" ${status==="previsto"?"selected":""}>Previsto (pendente)</option>
          </select></label>
        <label class="field"><span class="field-label" id="f-date-label">${status==="realizado"?"Data de realização":"Data prevista"}</span>
          <input class="input" type="date" id="f-data" value="${status==="realizado" ? (item?.data_realizada||todayISO()) : (item?.data_prevista||todayISO())}" required /></label>
      </div>
      <label class="field"><span class="field-label">Observação (opcional)</span>
        <textarea class="input" id="f-obs" rows="2" placeholder="Detalhes do lançamento...">${esc(item?item.observacao:"")}</textarea></label>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px;">
        <button type="button" class="btn btn-outline" id="f-cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="f-submit">${icon("check",15)} Salvar lançamento</button>
      </div>
    </form>`;
}
function openLancamentoModal(tipo, item, onSaved){
  const isEdit = !!item;
  openModal({
    title: isEdit ? "Editar lançamento" : `Nova ${tipo==="entrada"?"entrada":"saída"}`,
    wide: true,
    bodyHTML: lancamentoFormHTML(tipo, item),
    mount: (body)=>{
      const statusSel = body.querySelector("#f-status");
      statusSel.addEventListener("change", ()=>{
        const lbl = body.querySelector("#f-date-label");
        lbl.textContent = statusSel.value==="realizado" ? "Data de realização" : "Data prevista";
      });
      body.querySelector("#f-cancel").addEventListener("click", closeModal);
      const gerenciarBtn = body.querySelector("#btn-gerenciar-cat");
      if(gerenciarBtn) gerenciarBtn.addEventListener("click", (e)=>{
        e.preventDefault();
        openCategoriasModal(tipo, ()=>{
          const sel = body.querySelector("#f-categoria");
          const atual = sel.value;
          sel.innerHTML = catsFor(tipo).map(c=>`<option value="${esc(c)}" ${c===atual?"selected":""}>${esc(c)}</option>`).join("");
        });
      });
      body.querySelector("#lanc-form").addEventListener("submit", async (e)=>{
        e.preventDefault();
        const valor = parseFloat(body.querySelector("#f-valor").value);
        const contraparte = body.querySelector("#f-contraparte").value.trim();
        const unidade = body.querySelector("#f-unidade").value.trim();
        if(!valor || valor<=0 || !contraparte || !unidade) return;
        const status = body.querySelector("#f-status").value;
        const data = body.querySelector("#f-data").value || todayISO();
        const payload = {
          tipo, valor, categoria: body.querySelector("#f-categoria").value, contraparte, unidade,
          status, data_prevista: status==="realizado" ? (item?.data_prevista||data) : data,
          data_realizada: status==="realizado" ? data : null,
          observacao: body.querySelector("#f-obs").value.trim(),
        };
        const btn = body.querySelector("#f-submit");
        btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Salvando...`;
        try{
          if(isEdit) await editLancamento(item.id, payload);
          else await addLancamento(payload);
          closeModal();
          onSaved && onSaved();
        }catch(err){ toast(err.message, true); btn.disabled=false; btn.innerHTML = `${icon("check",15)} Salvar lançamento`; }
      });
    }
  });
}

        <div>
          <span class="field-label">${contraLabel}</span>
          <p style="margin:4px 0 0;font-weight:600;color:#44403c;font-size:16px;">${esc(l.contraparte)}</p>
        </div>
        ${badge(l.status)}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px;">
        ${campoDetalheFat("Categoria", esc(l.categoria||"—"))}
        ${campoDetalheFat("Unidade", esc(l.unidade||"—"))}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px;">
        ${campoDetalheFat("Valor", `<b>${currency(l.valor)}</b>`)}
        ${campoDetalheFat(l.status==="realizado" ? "Data de realização" : "Data prevista", fmtDate(l.data_realizada||l.data_prevista))}

function renderLancamentosView(container, tipo){
  const isEntrada = tipo==="entrada";
  const categorias = catsFor(tipo);
  const contraLabel = isEntrada ? "Origem" : "Destino";
  const unidades = Array.from(new Set(STATE.lancamentos.map(l=>l.unidade))).sort();

  const filters = { busca:"", de:"", ate:"", unidade:"", categoria:"", status:"" };
  const sortState = { key:"data", dir:"desc" };
  const sortExtractors = {
    data: l => l.data_realizada || l.data_prevista,
    status: l => l.status,
    categoria: l => l.categoria,
    contraparte: l => l.contraparte,
    unidade: l => l.unidade,
    valor: l => l.valor,
    observacao: l => l.observacao,
  };
  const selecionados = new Set();

  container.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;">
      <div>
        <h2 class="serif" style="margin:0;font-size:24px;color:${BRAND[800]};">${isEntrada?"Entradas":"Saídas"}</h2>
        <p class="muted" style="margin:4px 0 0;font-size:13px;" id="lanc-summary"></p>
      </div>
      <button class="btn btn-primary" id="btn-novo-lanc">${icon("plus",16)} Novo lançamento</button>
    </div>
    <div class="filter-bar">
      <div><span class="field-label">Buscar por nome</span>
        <div style="position:relative;">
          <span style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#a8a29e;">${icon("search",14)}</span>
          <input class="input" style="padding-left:30px;" id="fl-busca" placeholder="Buscar ${contraLabel.toLowerCase()} ou observação" />
        </div>
      </div>
      <div><span class="field-label">De</span><input class="input" type="date" id="fl-de" /></div>
      <div><span class="field-label">Até</span><input class="input" type="date" id="fl-ate" /></div>
      <div><span class="field-label">Unidade</span>
        <select class="input" id="fl-unidade"><option value="">Todas</option>${unidades.map(u=>`<option value="${esc(u)}">${esc(u)}</option>`).join("")}</select></div>
      <div><span class="field-label">Categoria</span>
        <select class="input" id="fl-categoria"><option value="">Todas</option>${categorias.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></div>
      <div><span class="field-label">Status</span>
        <select class="input" id="fl-status"><option value="">Todos</option><option value="realizado">Realizado</option><option value="previsto">Previsto</option></select></div>
    </div>
    <div id="lanc-results"></div>`;

  function refresh(){
    const dados = STATE.lancamentos.filter(l=>l.tipo===tipo).filter(l=>{
      const dataRef = l.data_realizada || l.data_prevista;
      if(filters.busca){ const alvo = `${l.contraparte} ${l.observacao}`.toLowerCase(); if(!alvo.includes(filters.busca.toLowerCase())) return false; }
      if(filters.de && dataRef < filters.de) return false;
      if(filters.ate && dataRef > filters.ate) return false;
      if(filters.unidade && l.unidade!==filters.unidade) return false;
      if(filters.categoria && l.categoria!==filters.categoria) return false;
      if(filters.status && l.status!==filters.status) return false;
      return true;
    });
    const dadosOrdenados = ordenarPor(dados, sortState, sortExtractors);
    const elegiveis = dadosOrdenados.filter(l=>l.status==="previsto").map(l=>l.id);
    Array.from(selecionados).forEach(id=>{ if(!elegiveis.includes(id)) selecionados.delete(id); });

    const total = dados.reduce((s,l)=> s + (l.status==="realizado"?l.valor:0), 0);
    document.getElementById("lanc-summary").innerHTML = `${dados.length} lançamento(s) · Total realizado: <b style="color:${isEntrada?BRAND[600]:DANGER};">${currency(total)}</b>${saldoContasInlineHTML()}`;

    const rows = document.getElementById("lanc-results");
    rows.innerHTML = `
      ${bulkBarHTML(selecionados, `Marcar como ${isEntrada?"recebido":"pago"}`)}
      <div class="card" style="overflow-x:auto;">
        <table>
          <thead><tr>
            ${thCheckAll()}${thSort("Data","data",sortState)}${thSort("Status","status",sortState)}${thSort("Categoria","categoria",sortState)}${thSort(contraLabel,"contraparte",sortState)}${thSort("Unidade","unidade",sortState)}
            ${thSort("Valor","valor",sortState,"text-align:right;")}${thSort("Observações","observacao",sortState)}<th style="text-align:right;">Ações</th>
          </tr></thead>
          <tbody>
            ${dadosOrdenados.map(l=>`
              <tr class="lanc-row" data-id="${l.id}" style="cursor:pointer;">
                ${l.status==="previsto" ? tdCheck(l.id, selecionados) : "<td></td>"}
                <td style="white-space:nowrap;">${fmtDate(l.data_realizada||l.data_prevista)}</td>
                <td>${badge(l.status)}</td>
                <td style="color:#57534e;">${esc(l.categoria)}</td>
                <td style="font-weight:500;color:#44403c;">${esc(l.contraparte)}</td>
                <td style="color:#78716c;">${esc(l.unidade)}</td>
                <td style="text-align:right;font-weight:600;color:${isEntrada?BRAND[600]:DANGER};">${currency(l.valor)}</td>
                <td style="color:#a8a29e;font-size:12px;">${esc(l.observacao||"—")}</td>
                <td>
                  <div style="display:flex;justify-content:flex-end;gap:2px;">
                    <button class="icon-btn edit-btn" data-id="${l.id}">${icon("edit",15,"#78716c")}</button>
                    <button class="icon-btn danger del-btn" data-id="${l.id}">${icon("trash",15,DANGER)}</button>
                  </div>
                </td>
              </tr>`).join("") || `<tr><td colspan="9" class="empty">Nenhum lançamento encontrado para os filtros aplicados.</td></tr>`}
          </tbody>
        </table>
      </div>`;

    wireSort(rows, sortState, refresh);
    wireTopScroll(rows);
    wireBulkSelect(rows, selecionados, elegiveis, refresh);
    wireBulkQuitar(rows, selecionados, { quitarFn: quitarConta, refresh, confirmMsg: n=>`Marcar ${n} lançamento(s) como ${isEntrada?"recebido(s)":"pago(s)"} com a data de hoje?` });
    rows.querySelectorAll(".edit-btn").forEach(b=> b.addEventListener("click", ()=>{
      const item = STATE.lancamentos.find(l=>l.id===b.dataset.id);
      openLancamentoModal(tipo, item, refresh);
    }));
    rows.querySelectorAll(".del-btn").forEach(b=> b.addEventListener("click", ()=>{
      const item = STATE.lancamentos.find(l=>l.id===b.dataset.id);
      openConfirm(`Excluir o lançamento de ${currency(item.valor)} referente a "${item.contraparte}"? Essa ação não pode ser desfeita.`, async ()=>{
        try{ await deleteLancamento(item.id); refresh(); }catch(err){ toast(err.message, true); }
      });
    }));
    rows.querySelectorAll(".lanc-row").forEach(tr=> tr.addEventListener("click", (e)=>{
      if(e.target.closest(".icon-btn") || e.target.closest("input")) return;
      const item = STATE.lancamentos.find(l=>l.id===tr.dataset.id);
      if(item) openLancamentoDetalheModal(item, refresh);
    }));
  }

  container.querySelector("#btn-novo-lanc").addEventListener("click", ()=> openLancamentoModal(tipo, null, refresh));
  ["busca","de","ate","unidade","categoria","status"].forEach(k=>{
    const el = container.querySelector(`#fl-${k}`);
    el.addEventListener(k==="busca"?"input":"change", ()=>{ filters[k]=el.value; refresh(); });
  });
  refresh();
}

/* ============================== Contas a Pagar / Receber ============================== */

    const receber = STATE.lancamentos.filter(l=>l.tipo==="entrada" && l.status==="previsto").sort((a,b)=>a.data_prevista.localeCompare(b.data_prevista));
    const lista = (titulo, itens, cor, acaoLabel) => `
      <div class="card" style="flex:1;overflow:hidden;">
        <div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">

                <p style="margin:0;font-size:14px;font-weight:500;color:#44403c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(l.contraparte)}</p>
                <p style="margin:2px 0 0;font-size:12px;color:#a8a29e;">${esc(l.categoria)} · ${esc(l.unidade)}</p>
                <p style="margin:2px 0 0;font-size:12px;${atrasado?`color:${DANGER};font-weight:600;`:"color:#a8a29e;"}">${atrasado?"Vencido em ":"Previsto para "}${fmtDate(l.data_prevista)}</p>
              </div>

                <p style="margin:0;font-size:14px;font-weight:600;color:${cor};">${currency(l.valor)}</p>

            </div>`;
          }).join("") || `<p class="empty">Nada por aqui. Tudo em dia!</p>`}
        </div>
      </div>`;
    container.innerHTML = `
      <h2 class="serif" style="margin:0 0 4px;font-size:24px;color:${BRAND[800]};">Contas a Pagar e a Receber</h2>
      <p class="muted" style="margin:0 0 18px;font-size:13px;">Lançamentos previstos que ainda não foram confirmados.</p>
      <div style="display:flex;flex-direction:column;gap:14px;" class="contas-flex">
        ${lista("Contas a Pagar", pagar, DANGER, "Marcar como pago")}
        ${lista("Contas a Receber", receber, BRAND[600], "Marcar como recebido")}
      </div>
      <style>@media(min-width:900px){.contas-flex{flex-direction:row !important;}}</style>`;
    container.querySelectorAll(".quitar-btn").forEach(b=> b.addEventListener("click", async ()=>{
      try{ await quitarConta(b.dataset.id); build(); }catch(err){ toast(err.message, true); }
    }));
  }
  build();
}

/* ============================== Dashboard ============================== */
function renderDashboard(container){
  const periodoState = defaultPeriodoState();

  function build(){
    const noPeriodo = noPeriodoFn(periodoState, l=>l.data_realizada||l.data_prevista);
    const entradasR = STATE.lancamentos.filter(l=>l.tipo==="entrada" && l.status==="realizado" && noPeriodo(l));
    const saidasR = STATE.lancamentos.filter(l=>l.tipo==="saida" && l.status==="realizado" && noPeriodo(l));
    const totalEntradas = entradasR.reduce((s,l)=>s+l.valor,0);
    const totalSaidas = saidasR.reduce((s,l)=>s+l.valor,0);
    const saldo = totalEntradas - totalSaidas;
    const previstoEntradas = STATE.lancamentos.filter(l=>l.tipo==="entrada" && noPeriodo(l)).reduce((s,l)=>s+l.valor,0);
    const previstoSaidas = STATE.lancamentos.filter(l=>l.tipo==="saida" && noPeriodo(l)).reduce((s,l)=>s+l.valor,0);

    const porCategoria = {}; saidasR.forEach(l=>{ porCategoria[l.categoria]=(porCategoria[l.categoria]||0)+l.valor; });
    const topCategorias = Object.entries(porCategoria).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const porUnidade = {}; entradasR.forEach(l=>{ porUnidade[l.unidade]=(porUnidade[l.unidade]||0)+l.valor; });
    const topUnidades = Object.entries(porUnidade).sort((a,b)=>b[1]-a[1]).slice(0,5);

    const pagarPend = STATE.lancamentos.filter(l=>l.tipo==="saida"&&l.status==="previsto").sort((a,b)=>a.data_prevista.localeCompare(b.data_prevista)).slice(0,4);
    const receberPend = STATE.lancamentos.filter(l=>l.tipo==="entrada"&&l.status==="previsto").sort((a,b)=>a.data_prevista.localeCompare(b.data_prevista)).slice(0,4);

    container.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;">
        <div>
          <h2 class="serif" style="margin:0;font-size:24px;color:${BRAND[800]};">Dashboard Financeiro</h2>
          <p class="muted" style="margin:4px 0 0;font-size:13px;">Visão geral de entradas, saídas e fluxo de caixa da Paulu's.</p>
        </div>
        ${periodoPickerHTML("db", periodoState)}
      </div>

      <div class="grid-4" style="margin-bottom:16px;">
        ${statCard("Entradas realizadas", currency(totalEntradas), "down", BRAND[100], BRAND[600])}
        ${statCard("Saídas realizadas", currency(totalSaidas), "up", DANGER_BG, DANGER)}
        ${statCard("Saldo do período", currency(saldo), "trending", saldo>=0?BRAND[100]:DANGER_BG, saldo>=0?BRAND[600]:DANGER)}
        ${statCard("Total previsto pendente", currency((previstoEntradas-totalEntradas)+(previstoSaidas-totalSaidas)), "clipboard", WARN_BG, WARN)}
      </div>

      <div class="grid-3" style="margin-bottom:16px;">
        <div class="card" style="padding:16px;">
          <h3 class="serif" style="margin:0 0 10px;font-size:15px;color:${BRAND[800]};">Fluxo de Caixa: Previsto vs. Realizado</h3>
          <canvas id="chart-fluxo" height="200"></canvas>
        </div>
        <div class="card" style="padding:16px;">
          <h3 class="serif" style="margin:0 0 10px;font-size:15px;color:${BRAND[800]};">Categorias que mais consumiram</h3>
          ${topCategorias.length ? `<canvas id="chart-cat" height="200"></canvas>` : `<p class="empty">Sem saídas realizadas no período.</p>`}
        </div>
        <div class="card" style="padding:16px;">
          <h3 class="serif" style="margin:0 0 10px;font-size:15px;color:${BRAND[800]};">Unidades com mais recebimento</h3>
          ${topUnidades.length ? `<canvas id="chart-uni" height="200"></canvas>` : `<p class="empty">Sem entradas realizadas no período.</p>`}
        </div>
      </div>

      <div class="grid-2">
        <div class="card" style="padding:16px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <h3 class="serif" style="margin:0;font-size:15px;color:${BRAND[800]};">Próximas contas a pagar</h3>${icon("chevron",16,"#d6d3cd")}
          </div>
          ${pagarPend.map(l=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #faf9f6;font-size:14px;"><span style="color:#57534e;">${esc(l.contraparte)}</span><span style="font-weight:500;color:${DANGER};">${currency(l.valor)}</span></div>`).join("") || `<p class="muted" style="font-size:13px;padding:10px 0;">Nenhuma pendência.</p>`}
        </div>
        <div class="card" style="padding:16px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <h3 class="serif" style="margin:0;font-size:15px;color:${BRAND[800]};">Próximas contas a receber</h3>${icon("chevron",16,"#d6d3cd")}
          </div>
          ${receberPend.map(l=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #faf9f6;font-size:14px;"><span style="color:#57534e;">${esc(l.contraparte)}</span><span style="font-weight:500;color:${BRAND[600]};">${currency(l.valor)}</span></div>`).join("") || `<p class="muted" style="font-size:13px;padding:10px 0;">Nenhuma pendência.</p>`}
        </div>
      </div>`;

    wirePeriodoPicker("db", container, periodoState, build);

    mkBarChart("chart-fluxo", ["Entradas","Saídas"], [
      {label:"Previsto", data:[previstoEntradas, previstoSaidas], color:BRAND[200]},
      {label:"Realizado", data:[totalEntradas, totalSaidas], color:BRAND[600]},
    ], true);
    if(topCategorias.length) mkHBarChart("chart-cat", topCategorias);
    if(topUnidades.length) mkHBarChart("chart-uni", topUnidades);
  }
  build();
}

function mkBarChart(canvasId, labels, datasets, legend){
  const ctx = document.getElementById(canvasId); if(!ctx) return;
  if(CHARTS[canvasId]) CHARTS[canvasId].destroy();
  CHARTS[canvasId] = new Chart(ctx, {
    type:"bar",
    data:{ labels, datasets: datasets.map(d=>({label:d.label, data:d.data, backgroundColor:d.color, borderRadius:5, maxBarThickness:38})) },
    options:{ responsive:true, plugins:{ legend:{display:!!legend, labels:{boxWidth:10,font:{size:11}}}, tooltip:{callbacks:{label:(c)=>currency(c.raw)}} },
      scales:{ x:{grid:{display:false}}, y:{ticks:{callback:(v)=> (v/1000)+"k"}, grid:{color:"#f1efe9"}} } }
  });
}
function mkHBarChart(canvasId, entries){
  const ctx = document.getElementById(canvasId); if(!ctx) return;
  if(CHARTS[canvasId]) CHARTS[canvasId].destroy();
  const palette=[BRAND[600],BRAND[500],BRAND[400],BRAND[200],"#dfeee5"];
  CHARTS[canvasId] = new Chart(ctx, {
    type:"bar",
    data:{ labels: entries.map(e=>e[0]), datasets:[{ data: entries.map(e=>e[1]), backgroundColor: entries.map((_,i)=>palette[i%palette.length]), borderRadius:5 }] },
    options:{ indexAxis:"y", responsive:true, plugins:{ legend:{display:false}, tooltip:{callbacks:{label:(c)=>currency(c.raw)}} },
      scales:{ x:{display:false}, y:{grid:{display:false}, ticks:{font:{size:11}}} } }
  });
}

/* ============================== Análise Personalizada ============================== */

    const opcoes = Array.from(set).sort();
    const filtrados = valorSel ? STATE.lancamentos.filter(l=> (modo==="categoria"?l.categoria:l.contraparte)===valorSel) : [];
    const entradas = filtrados.filter(l=>l.tipo==="entrada"&&l.status==="realizado").reduce((s,l)=>s+l.valor,0);

        </div>
        <div class="card" style="overflow-x:auto;">

      </div>`;

    container.querySelector("#pz-modo").addEventListener("change",(e)=>{ modo=e.target.value; valorSel=""; build(); });

    if(valSel) valSel.addEventListener("change",(e)=>{ valorSel=e.target.value; build(); });

    if(valorSel && serieKeys.length){
      const ctx = document.getElementById("chart-pz");
      if(CHARTS["chart-pz"]) CHARTS["chart-pz"].destroy();
      CHARTS["chart-pz"] = new Chart(ctx, {
        type:"line",
        data:{ labels: serieKeys.map(monthLabel), datasets:[{ data: serieKeys.map(k=>porMes[k]), borderColor:BRAND[600], backgroundColor:BRAND[100], fill:true, tension:.35, pointRadius:3 }] },
        options:{ plugins:{legend:{display:false}, tooltip:{callbacks:{label:(c)=>currency(c.raw)}}}, scales:{ y:{ticks:{callback:(v)=>(v/1000)+"k"}, grid:{color:"#f1efe9"}}, x:{grid:{display:false}} } }
      });
    }
  }
  build();
}

function renderCartoesLancamentos(container){
  const cartoes = Array.from(new Set(STATE.cartaoLancamentos.map(l=>l.cartao))).sort();
  const filters = { busca:"", de:"", ate:"", cartao:"", categoria:"", status:"" };
  const sortState = { key:"data", dir:"desc" };
  const sortExtractors = {
    data: l => l.data,
    status: l => l.status,
    categoria: l => l.categoria,
    descricao: l => l.descricao,
    cartao: l => l.cartao,
    portador: l => l.portador,
    valor: l => l.valor,
  };
  const selecionados = new Set();

  container.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;">
      <div>
        <h2 class="serif" style="margin:0;font-size:24px;color:${BRAND[800]};">Gastos do Cartão</h2>
        <p class="muted" style="margin:4px 0 0;font-size:13px;" id="cartao-summary"></p>
      </div>
      <button class="btn btn-primary" id="btn-novo-cartao">${icon("plus",16)} Novo gasto</button>
    </div>
    <div class="filter-bar">
      <div><span class="field-label">Buscar</span>
        <div style="position:relative;">
          <span style="position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#a8a29e;">${icon("search",14)}</span>
          <input class="input" style="padding-left:30px;" id="cfl-busca" placeholder="Descrição, portador ou observação" />
        </div>
      </div>
      <div><span class="field-label">De</span><input class="input" type="date" id="cfl-de" /></div>
      <div><span class="field-label">Até</span><input class="input" type="date" id="cfl-ate" /></div>
      <div><span class="field-label">Cartão</span>
        <select class="input" id="cfl-cartao"><option value="">Todos</option>${cartoes.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></div>
      <div><span class="field-label">Categoria</span>
        <select class="input" id="cfl-categoria"><option value="">Todas</option>${catsFor("cartao").map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></div>
      <div><span class="field-label">Status</span>
        <select class="input" id="cfl-status"><option value="">Todos</option><option value="realizado">Pago</option><option value="previsto">Em aberto</option></select></div>
    </div>
    <div id="cartao-results"></div>`;

  function refresh(){
    const dados = STATE.cartaoLancamentos.filter(l=>{
      if(filters.busca){ const alvo = `${l.descricao} ${l.portador} ${l.observacao}`.toLowerCase(); if(!alvo.includes(filters.busca.toLowerCase())) return false; }
      if(filters.de && l.data < filters.de) return false;
      if(filters.ate && l.data > filters.ate) return false;
      if(filters.cartao && l.cartao!==filters.cartao) return false;
      if(filters.categoria && l.categoria!==filters.categoria) return false;
      if(filters.status && l.status!==filters.status) return false;
      return true;
    });
    const dadosOrdenados = ordenarPor(dados, sortState, sortExtractors);
    const elegiveis = dadosOrdenados.filter(l=>l.status==="previsto").map(l=>l.id);
    Array.from(selecionados).forEach(id=>{ if(!elegiveis.includes(id)) selecionados.delete(id); });

    const total = dados.reduce((s,l)=> s + (l.status==="realizado"?l.valor:0), 0);
    document.getElementById("cartao-summary").innerHTML = `${dados.length} lançamento(s) · Total pago: <b style="color:${DANGER};">${currency(total)}</b>${saldoContasInlineHTML()}`;

    const rows = document.getElementById("cartao-results");
    rows.innerHTML = `
      ${bulkBarHTML(selecionados, "Marcar como pago")}
      <div class="card" style="overflow-x:auto;">
        <table>
          <thead><tr>
            ${thCheckAll()}${thSort("Data","data",sortState)}${thSort("Status","status",sortState)}${thSort("Categoria","categoria",sortState)}${thSort("Descrição","descricao",sortState)}${thSort("Cartão","cartao",sortState)}${thSort("Portador","portador",sortState)}<th>Parcela</th>
            ${thSort("Valor","valor",sortState,"text-align:right;")}<th style="text-align:right;">Ações</th>
          </tr></thead>
          <tbody>
            ${dadosOrdenados.map(l=>`
              <tr class="cartao-row" data-id="${l.id}" style="cursor:pointer;">
                ${l.status==="previsto" ? tdCheck(l.id, selecionados) : "<td></td>"}
                <td style="white-space:nowrap;">${fmtDate(l.data)}</td>
                <td>${cartaoBadge(l.status)}</td>
                <td style="color:#57534e;">${esc(l.categoria)}</td>
                <td style="font-weight:500;color:#44403c;">${esc(l.descricao)}</td>
                <td style="color:#78716c;">${esc(l.cartao)}</td>
                <td style="color:#78716c;">${esc(l.portador)}</td>
                <td style="color:#a8a29e;">${parcelaLabel(l)}</td>
                <td style="text-align:right;font-weight:600;color:${DANGER};">${currency(l.valor)}</td>
                <td>
                  <div style="display:flex;justify-content:flex-end;gap:2px;">
                    <button class="icon-btn edit-cartao-btn" data-id="${l.id}">${icon("edit",15,"#78716c")}</button>
                    <button class="icon-btn danger del-cartao-btn" data-id="${l.id}">${icon("trash",15,DANGER)}</button>
                  </div>
                </td>
              </tr>`).join("") || `<tr><td colspan="10" class="empty">Nenhum gasto encontrado para os filtros aplicados.</td></tr>`}
          </tbody>
        </table>
      </div>`;

    wireSort(rows, sortState, refresh);
    wireTopScroll(rows);
    wireBulkSelect(rows, selecionados, elegiveis, refresh);
    wireBulkQuitar(rows, selecionados, { quitarFn: quitarParcela, refresh, confirmMsg: n=>`Marcar ${n} gasto(s) como pago(s) com a data de hoje?` });
    rows.querySelectorAll(".edit-cartao-btn").forEach(b=> b.addEventListener("click", ()=>{
      const item = STATE.cartaoLancamentos.find(l=>l.id===b.dataset.id);
      openCartaoEditModal(item, refresh);
    }));
    rows.querySelectorAll(".del-cartao-btn").forEach(b=> b.addEventListener("click", ()=>{
      const item = STATE.cartaoLancamentos.find(l=>l.id===b.dataset.id);
      openConfirm(`Excluir o gasto "${item.descricao}" (${parcelaLabel(item)}) de ${currency(item.valor)}? Essa ação não pode ser desfeita.`, async ()=>{
        try{ await deleteCartaoLancamento(item.id); refresh(); }catch(err){ toast(err.message, true); }
      });
    }));
    rows.querySelectorAll(".cartao-row").forEach(tr=> tr.addEventListener("click", (e)=>{
      if(e.target.closest(".icon-btn") || e.target.closest("input")) return;
      const item = STATE.cartaoLancamentos.find(l=>l.id===tr.dataset.id);
      if(item) openCartaoLancamentoDetalheModal(item, refresh);
    }));
  }

  container.querySelector("#btn-novo-cartao").addEventListener("click", ()=> openCartaoCompraModal(refresh));
  ["busca","de","ate","cartao","categoria","status"].forEach(k=>{
    const el = container.querySelector(`#cfl-${k}`);
    el.addEventListener(k==="busca"?"input":"change", ()=>{ filters[k]=el.value; refresh(); });
  });
  refresh();
}

                <p style="margin:2px 0 0;font-size:12px;color:#a8a29e;">${esc(l.cartao)} · ${esc(l.portador)}</p>
                <p style="margin:2px 0 0;font-size:12px;${atrasado?`color:${DANGER};font-weight:600;`:"color:#a8a29e;"}">${atrasado?"Vencida em ":"Prevista para "}${fmtDate(l.data)}</p>
              </div>
              <div style="text-align:right;flex-shrink:0;">
                <p style="margin:0;font-size:14px;font-weight:600;color:${DANGER};">${currency(l.valor)}</p>
                <button class="quitar-parcela-btn" data-id="${l.id}" style="border:none;background:none;font-size:11px;margin-top:2px;color:${BRAND[600]};text-decoration:underline;cursor:pointer;">Marcar como pago</button>
              </div>
            </div>`;
          }).join("") || `<p class="empty">Nenhuma parcela em aberto. Tudo em dia!</p>`}
        </div>
      </div>`;

    wirePeriodoPicker("cdb", container, periodoState, build);
    container.querySelectorAll(".quitar-parcela-btn").forEach(b=> b.addEventListener("click", async ()=>{
      try{ await quitarParcela(b.dataset.id); build(); }catch(err){ toast(err.message, true); }
    }));

    if(topCategorias.length) mkHBarChart("chart-cartao-cat", topCategorias);
    if(topCartoes.length) mkHBarChart("chart-cartao-uso", topCartoes);
  }
  build();
}

/* ============================== Vales (apenas entradas) ============================== */

  return `<span class="badge ${ok?"badge-ok":"badge-pending"}"><span class="dot" style="background:${ok?BRAND[500]:"#c9922c"}"></span>${ok?"Recebido":"A receber"}</span>`;
}

  const status = item?.status || "realizado";
  const origens = Array.from(new Set(STATE.valeLancamentos.map(l=>l.origem))).sort();

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px;">
        <label class="field"><span class="field-label">Origem / Emissor</span>
          <input class="input" id="v-origem" list="vale-origens-list" value="${esc(item?item.origem:"")}" placeholder="ex: Sodexo, Alelo, VR..." required />
          <datalist id="vale-origens-list">${origens.map(o=>`<option value="${esc(o)}">`).join("")}</datalist></label>
        <label class="field"><span class="field-label">Unidade</span>
          <input class="input" id="v-unidade" list="vale-unidades-list" value="${esc(item?item.unidade:"")}" placeholder="ex: Unidade Centro" required />
          <datalist id="vale-unidades-list">${unidades.map(u=>`<option value="${esc(u)}">`).join("")}</datalist></label>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 14px;">

          <select class="input" id="v-status">

            <option value="previsto" ${status==="previsto"?"selected":""}>A receber</option>

        <label class="field"><span class="field-label">Data</span>

        <textarea class="input" id="v-obs" rows="2">${esc(item?item.observacao:"")}</textarea></label>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px;">
        <button type="button" class="btn btn-outline" id="v-cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="v-submit">${icon("check",15)} Salvar vale</button>
      </div>
    </form>`;
}
function openValeModal(item, onSaved){
  const isEdit = !!item;
  openModal({
    title: isEdit ? "Editar vale" : "Novo vale",
    wide: true,
    bodyHTML: valeFormHTML(item),
    mount:(body)=>{
      body.querySelector("#v-cancel").addEventListener("click", closeModal);
      const gerenciarBtn = body.querySelector("#btn-gerenciar-cat");
      if(gerenciarBtn) gerenciarBtn.addEventListener("click", (e)=>{
        e.preventDefault();
        openCategoriasModal("vale", ()=>{
          const sel = body.querySelector("#v-categoria");
          const atual = sel.value;
          sel.innerHTML = catsFor("vale").map(c=>`<option value="${esc(c)}" ${c===atual?"selected":""}>${esc(c)}</option>`).join("");
        });
      });
      body.querySelector("#vale-form").addEventListener("submit", async (e)=>{
        e.preventDefault();
        const valor = parseFloat(body.querySelector("#v-valor").value);
        const descricao = body.querySelector("#v-descricao").value.trim();
        const origem = body.querySelector("#v-origem").value.trim();
        const unidade = body.querySelector("#v-unidade").value.trim();
        if(!valor || valor<=0 || !descricao || !origem || !unidade) return;
        const payload = {
          valor, categoria: body.querySelector("#v-categoria").value, descricao, origem, unidade,
          status: body.querySelector("#v-status").value, data: body.querySelector("#v-data").value || todayISO(),
          observacao: body.querySelector("#v-obs").value.trim(),
        };
        const btn = body.querySelector("#v-submit");
        btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Salvando...`;
        try{
          if(isEdit) await editVale(item.id, payload);
          else await addVale(payload);
          closeModal(); onSaved && onSaved();
        }catch(err){ toast(err.message, true); btn.disabled=false; btn.innerHTML = `${icon("check",15)} Salvar vale`; }
      });
    }
  });
}
